<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #06060f;
    --surf:     #0b0b1a;
    --surf2:    #0f0f22;
    --surf3:    #14142e;
    --border:   #1c1c38;
    --bord-h:   #2c2c55;
    --sel:      #1b2a4a;
    --acc:      #00d4ff;
    --acc-dim:  #002233;
    --acc-mid:  #004d66;
    --purp:     #a78bfa;
    --purp-dim: #1a0d40;
    --purp-mid: #3d2080;
    --red:      #f87171;
    --red-dim:  #1e0808;
    --red-mid:  #4a1010;
    --gold:     #fbbf24;
    --gold-dim: #2a2008;
    --green:    #4ade80;
    --txt:      #dce4f5;
    --txt2:     #4a5a78;
    --txt3:     #222840;
    --overlay:  rgba(2,2,8,0.85);
  }
  :root[data-theme="light"] {
    --bg:       #eef0f6;
    --surf:     #ffffff;
    --surf2:    #f5f6fb;
    --surf3:    #e6e8f2;
    --border:   #d6d9e6;
    --bord-h:   #bfc4d8;
    --sel:      #dbe4ff;
    --purp:     #6d28d9;
    --purp-dim: #ede9fe;
    --purp-mid: #ddd6fe;
    --red:      #dc2626;
    --red-dim:  #fee2e2;
    --red-mid:  #fecaca;
    --gold:     #b45309;
    --gold-dim: #fef3c7;
    --green:    #15803d;
    --txt:      #161a2b;
    --txt2:     #5b6480;
    --txt3:     #9aa1b8;
    --overlay:  rgba(200,204,216,0.85);
  }

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; height: 100vh; overflow: hidden;
  }
  button { font-family: inherit; }
  input, textarea, select { font-family: inherit; color: var(--txt); }

  /* ══ SIDEBAR ══ */
  #sidebar {
    width: 240px; min-width: 240px; background: var(--surf);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #logo { height: 80px; min-height: 80px; padding: 18px 18px 0; border-bottom: 1px solid var(--border); position: relative; }
  #logo .logo-line { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
  #logo .logo-line span:first-child { color: var(--acc); }
  #logo .logo-line span:last-child  { color: var(--purp); }
  #logo .logo-sub { font-size: 9px; color: var(--txt2); margin-top: 4px; }
  #logo .icons { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .icon-btn { background: none; border: none; color: var(--txt2); cursor: pointer; font-size: 14px; padding: 2px 4px; }
  .icon-btn:hover { color: var(--acc); }

  #view-tabs { display: flex; gap: 6px; padding: 10px 10px 0; }
  .view-tab {
    flex: 1; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surf2); color: var(--txt2); font-size: 11px; font-weight: bold;
    cursor: pointer; transition: all 0.15s;
  }
  .view-tab:hover { background: var(--surf3); }
  .view-tab.active { background: var(--acc-dim); border-color: var(--acc); color: var(--acc); }

  #cat-head { display: flex; align-items: center; padding: 10px 18px 4px; }
  #cat-label { font-size: 9px; font-weight: bold; color: var(--txt3); letter-spacing: 1px; flex: 1; }
  #cat-list { flex: 1; overflow-y: auto; padding: 4px 6px; }
  #cat-list::-webkit-scrollbar { width: 4px; }
  #cat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .cat-row {
    display: flex; align-items: center; height: 38px; border-radius: 6px; margin: 2px 0;
    cursor: pointer; background: var(--surf); transition: background 0.15s;
  }
  .cat-row:hover { background: var(--surf3); }
  .cat-row.selected { background: var(--surf3); }
  .cat-row.drag-over { outline: 1px solid var(--acc); }
  .cat-bar { width: 3px; height: 26px; border-radius: 2px; background: transparent; margin: 0 6px 0 4px; flex-shrink: 0; }
  .cat-row.selected .cat-bar { background: var(--acc); }
  .cat-name { flex: 1; font-size: 13px; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-row.selected .cat-name { color: var(--acc); }
  .cat-badge { font-size: 10px; font-weight: bold; color: var(--txt2); background: var(--surf3); padding: 2px 7px; border-radius: 10px; margin-right: 8px; }
  .cat-row.selected .cat-badge { color: var(--acc); background: var(--acc-dim); }

  #sidebar-tools { display: flex; gap: 4px; padding: 6px 10px 0; }
  #sidebar-tools button { flex: 1; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--txt2); font-size: 12px; cursor: pointer; }
  #sidebar-tools button:hover { background: var(--surf3); color: var(--txt); }
  #sidebar-footer { padding: 6px 10px; display: flex; gap: 6px; }
  #sidebar-footer button {
    flex: 1; height: 32px; border-radius: 8px; border: 1px solid var(--bord-h);
    background: transparent; color: var(--txt2); font-size: 11px; cursor: pointer;
  }
  #sidebar-footer button:hover { background: var(--surf3); color: var(--txt); }
  #new-cat-wrap { padding: 0 10px 8px; }
  #new-cat-btn { width: 100%; height: 32px; border-radius: 8px; border: 1px solid var(--acc-mid); background: transparent; color: var(--acc); font-size: 11px; cursor: pointer; }
  #new-cat-btn:hover { background: var(--acc-dim); }
  #privacy-wrap { padding: 0 10px 10px; text-align: center; }
  #privacy-link { font-size: 10px; color: var(--txt2); text-decoration: none; }
  #privacy-link:hover { color: var(--acc); }

  /* ══ CONTENT ══ */
  #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  #lib-view, #builder-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .hidden { display: none !important; }

  .topbar {
    min-height: 66px; background: var(--surf); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 18px 8px 22px; gap: 10px; flex-wrap: wrap;
  }
  .top-left { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .top-title { font-size: 17px; font-weight: bold; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-sub { font-size: 10px; color: var(--txt2); margin-top: 2px; }
  .top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .chk { display: flex; align-items: center; gap: 5px; color: var(--txt2); font-size: 11px; cursor: pointer; user-select: none; }
  .chk input { accent-color: var(--acc); cursor: pointer; }
  select.sel, input.inp, textarea.ta {
    background: var(--surf2); border: 1px solid var(--bord-h); border-radius: 10px;
    color: var(--txt); font-size: 12px; padding: 0 12px; height: 34px; outline: none;
  }
  select.sel { cursor: pointer; }
  input.inp:focus, textarea.ta:focus, select.sel:focus { border-color: var(--acc); }
  input.inp::placeholder { color: var(--txt2); }
  textarea.ta { padding: 8px 12px; height: auto; resize: vertical; line-height: 1.5; }
  input#search { width: 200px; }

  /* ══ BUTTONS ══ */
  .btn {
    height: 34px; border-radius: 10px; border: 1px solid; font-weight: bold; font-size: 13px;
    cursor: pointer; padding: 0 16px; transition: background 0.15s; white-space: nowrap;
  }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn-acc   { background: var(--acc-dim);  border-color: var(--acc);  color: var(--acc); }
  .btn-acc:not(:disabled):hover  { background: var(--acc-mid); }
  .btn-purp  { background: var(--purp-dim); border-color: var(--purp); color: var(--purp); }
  .btn-purp:not(:disabled):hover { background: var(--purp-mid); }
  .btn-gold  { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
  .btn-gold:not(:disabled):hover { filter: brightness(1.2); }
  .btn-red   { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .btn-red:not(:disabled):hover { background: var(--red-mid); }
  .btn-ghost { background: transparent; border-color: var(--bord-h); color: var(--txt2); font-size: 11px; height: 26px; border-radius: 8px; padding: 0 10px; font-weight: normal; }
  .btn-ghost:hover { background: var(--surf3); color: var(--txt); }
  .btn-ghost.on { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .btn-ghost.acc { color: var(--acc); }
  .btn-ghost.purp { color: var(--purp); }
  .btn-ghost.purp:hover { background: var(--purp-dim); }
  .btn-ghost.danger { color: var(--red); }
  .btn-ghost.danger:hover { background: var(--red-dim); }
  .btn-ghost.gold { color: var(--gold); }
  .btn.tall { height: 34px; border-radius: 10px; font-size: 12px; }

  /* ══ BARS ══ */
  #tag-bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 8px 18px 0; }
  #tag-bar:empty { display: none; }
  .bar-label { font-size: 9px; font-weight: bold; color: var(--txt3); letter-spacing: 1px; margin-right: 6px; }
  .chip {
    font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 10px;
    background: var(--surf2); color: var(--txt2); border: 1px solid transparent; cursor: default; white-space: nowrap;
  }
  .chip.click { cursor: pointer; }
  .chip.click:hover { border-color: var(--bord-h); }
  .chip.on { background: var(--acc-dim); color: var(--acc); }
  .chip.purp { color: var(--purp); background: var(--purp-dim); }
  .chip.red { color: var(--red); background: var(--red-dim); }
  .chip.acc { color: var(--acc); background: var(--acc-dim); }
  #bulk-bar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 8px 18px 0;
    padding: 6px 8px; background: var(--surf2); border: 1px solid var(--acc); border-radius: 8px;
  }
  #bulk-bar .count { color: var(--acc); font-weight: bold; font-size: 11px; margin-right: 6px; }
  #bulk-bar .spacer { flex: 1; }

  /* ══ LISTS ══ */
  #list-wrap, #slot-wrap { flex: 1; overflow-y: auto; padding: 12px 14px; }
  #list-wrap::-webkit-scrollbar, #slot-wrap::-webkit-scrollbar { width: 6px; }
  #list-wrap::-webkit-scrollbar-thumb, #slot-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .empty-msg { color: var(--txt2); font-size: 13px; text-align: center; margin-top: 60px; line-height: 1.7; }

  .card { background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .card.selected { background: var(--sel); border-color: var(--acc); }
  .card.drag-over { border-color: var(--acc); }
  .card.negative { border-color: var(--red-mid); }
  .card.locked { border-color: var(--acc); }
  .card-header { display: flex; align-items: center; gap: 6px; padding: 8px 12px 4px; flex-wrap: wrap; }
  .card-num { font-family: Consolas, monospace; font-size: 10px; font-weight: bold; color: var(--acc); }
  .card-title { font-size: 12px; font-weight: bold; color: var(--txt); }
  .card-btns { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  .card-divider { height: 1px; background: var(--border); margin: 2px 12px; }
  .card-text { font-family: Consolas, monospace; font-size: 12px; color: var(--txt); padding: 4px 12px 8px; line-height: 1.5; word-break: break-word; cursor: pointer; }
  .card-text.none { color: var(--txt2); font-style: italic; cursor: default; }
  .card-foot { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 0 12px 8px; font-size: 9px; color: var(--txt3); }
  .card-foot .right { margin-left: auto; display: flex; gap: 10px; }
  .grip { color: var(--txt3); cursor: grab; font-size: 12px; user-select: none; padding: 0 2px; }
  .cb { cursor: pointer; font-size: 14px; color: var(--txt2); user-select: none; }
  .cb.on { color: var(--acc); }
  .slot-name { font-size: 12px; font-weight: bold; color: var(--purp); }
  .slot-name.txt { color: var(--acc); }
  .slot-name.missing { color: var(--red); }

  /* ══ RESULT BAR ══ */
  #result-bar { background: var(--surf); border-top: 1px solid var(--border); padding: 10px 14px; flex-shrink: 0; }
  #result-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  #tok-lbl { font-size: 10px; color: var(--txt2); }
  #tok-lbl.warn { color: var(--red); }
  #tpl-lbl { font-size: 10px; color: var(--purp); font-weight: bold; }
  #result-text, #neg-text {
    font-family: Consolas, monospace; font-size: 12px; color: var(--txt);
    background: var(--surf2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 8px; min-height: 36px; max-height: 110px; overflow-y: auto; word-break: break-word;
  }
  #result-text.empty { color: var(--txt2); font-style: italic; }
  #neg-wrap { display: flex; gap: 8px; align-items: flex-start; }
  #neg-wrap .lbl { font-size: 9px; font-weight: bold; color: var(--red); margin-top: 8px; letter-spacing: 1px; }
  #neg-text { flex: 1; color: var(--txt2); }
  #result-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sep-lbl { font-size: 10px; color: var(--txt2); }
  #sep-input { width: 70px; height: 30px; text-align: center; padding: 0; }

  /* ══ MODALS ══ */
  #modal-root { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; z-index: 100; padding: 12px; }
  #modal-root.show { display: flex; }
  .modal {
    background: var(--surf); border: 1px solid var(--bord-h); border-radius: 14px;
    display: flex; flex-direction: column; overflow: hidden; max-height: 95vh; max-width: 100%; width: 680px;
  }
  .modal-header { background: var(--surf2); padding: 12px 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .modal-title { font-size: 14px; font-weight: bold; color: var(--acc); }
  .modal-title.purp { color: var(--purp); }
  .modal-hint { font-size: 10px; color: var(--txt2); flex: 1; }
  .modal-x { margin-left: auto; background: none; border: 1px solid transparent; color: var(--txt2); cursor: pointer; font-size: 14px; padding: 2px 8px; border-radius: 6px; }
  .modal-x:hover { color: var(--red); background: var(--red-dim); }
  .modal-body { padding: 14px 18px 6px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .modal-body::-webkit-scrollbar { width: 5px; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 18px 16px; flex-shrink: 0; flex-wrap: wrap; }
  .modal-footer .left { margin-right: auto; }
  .modal-footer .btn { font-size: 12px; height: 34px; }
  .lbl { font-size: 10px; color: var(--txt2); }
  .lbl-sec { font-size: 10px; font-weight: bold; color: var(--acc); letter-spacing: 1px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row .grow { flex: 1; min-width: 120px; }
  .form-row { display: flex; align-items: center; gap: 10px; }
  .form-row .k { width: 170px; font-size: 11px; color: var(--txt2); flex-shrink: 0; }
  .hint { font-size: 9px; color: var(--txt3); }
  .list-box { border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 6px; overflow-y: auto; flex: 1; min-height: 120px; }
  .pick-item { background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-family: Consolas, monospace; font-size: 12px; cursor: pointer; word-break: break-word; }
  .pick-item:hover { border-color: var(--acc); }
  .pick-item.on { border-color: var(--purp); background: var(--purp-dim); }
  .stat { font-size: 12px; color: var(--txt); line-height: 1.8; }
  input[type=range] { accent-color: var(--acc); }

  /* Editor mit Syntax-Hervorhebung */
  .hl-wrap { position: relative; border: 1px solid var(--bord-h); border-radius: 10px; background: var(--surf2); overflow: hidden; }
  .hl-wrap:focus-within { border-color: var(--acc); }
  .hl-back, .hl-ta {
    font-family: Consolas, monospace; font-size: 13px; line-height: 1.5; padding: 10px 12px;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; margin: 0;
  }
  .hl-back { position: absolute; inset: 0; color: var(--txt); pointer-events: none; overflow: hidden; }
  .hl-ta {
    position: relative; width: 100%; background: transparent; color: transparent; caret-color: var(--txt);
    border: none; outline: none; resize: vertical; display: block; min-height: 120px;
  }
  .hl-ta::selection { background: var(--acc-mid); }
  .hl-w { color: var(--acc); } .hl-e { color: var(--gold); } .hl-d { color: var(--txt2); }
  .hl-x { color: var(--purp); } .hl-l { color: var(--green); } .hl-b { color: var(--red); font-weight: bold; }
  .counter { font-size: 9px; color: var(--txt2); text-align: right; }
  .counter.warn { color: var(--red); }

  /* Pop menu */
  #pop-menu {
    position: fixed; z-index: 300; display: none; min-width: 180px; max-height: 60vh; overflow-y: auto;
    background: var(--surf2); border: 1px solid var(--bord-h); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #pop-menu.show { display: block; }
  #pop-menu button { display: block; width: 100%; text-align: left; background: transparent; border: none; color: var(--txt); font-size: 12px; padding: 9px 14px; cursor: pointer; }
  #pop-menu button:hover { background: var(--surf3); color: var(--acc); }
  #pop-menu button.danger:hover { background: var(--red-dim); color: var(--red); }
  #pop-menu button:disabled { color: var(--txt3); cursor: default; }
  .pop-title { font-size: 9px; font-weight: bold; color: var(--txt2); padding: 8px 14px 4px; letter-spacing: 1px; }
  .pop-sep { height: 1px; background: var(--border); margin: 4px 0; }

  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--acc-mid); border: 1px solid var(--acc); color: var(--acc); font-size: 12px;
    padding: 8px 20px; border-radius: 20px; opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 400;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  kbd { font-family: Consolas, monospace; font-size: 11px; background: var(--surf2); border: 1px solid var(--bord-h); border-radius: 4px; padding: 2px 6px; color: var(--acc); }
  table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.t td { padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }

  /* ══ MOBILE ══ */
  #mob-header, #mob-tabs, #mob-cats { display: none; }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    #sidebar { display: none; }
    #mob-header { display: flex; align-items: center; justify-content: space-between; background: var(--surf); border-bottom: 1px solid var(--border); padding: 10px 14px; flex-shrink: 0; }
    #mob-header .logo-line { font-size: 15px; font-weight: bold; }
    #mob-header .logo-line span:first-child { color: var(--acc); }
    #mob-header .logo-line span:last-child  { color: var(--purp); }
    #mob-header .mob-io { display: flex; gap: 6px; }
    #mob-header .mob-io button { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--bord-h); background: transparent; color: var(--txt2); font-size: 11px; cursor: pointer; }
    #mob-tabs { display: flex; gap: 6px; padding: 8px 10px 0; background: var(--surf); flex-shrink: 0; }
    #mob-cats { display: flex; overflow-x: auto; gap: 6px; padding: 8px 10px; background: var(--surf); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #mob-cats::-webkit-scrollbar { display: none; }
    .mob-cat { white-space: nowrap; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surf2); color: var(--txt2); font-size: 12px; cursor: pointer; flex-shrink: 0; }
    .mob-cat.selected { background: var(--acc-dim); border-color: var(--acc); color: var(--acc); }
    .topbar { padding: 10px 12px; }
    .top-left { display: none; }
    .top-right { width: 100%; justify-content: flex-end; }
    input#search { flex: 1; min-width: 0; width: auto; }
    .btn { font-size: 12px; padding: 0 12px; }
    #modal-root { padding: 0; align-items: flex-end; }
    .modal { border-radius: 14px 14px 0 0; max-height: 92vh; width: 100%; }
    .form-row { flex-wrap: wrap; } .form-row .k { width: 100%; }
  }
</style>
</head>
<body>

<div id="mob-header">
  <div class="logo-line"><span>PROMPT</span><span>VAULT</span></div>
  <div class="mob-io">
    <button onclick="importFile()">Import</button>
    <button onclick="openExportMenu(event)">Export</button>
    <button onclick="openSettings()">⚙</button>
  </div>
</div>
<div id="mob-tabs">
  <button class="view-tab active" data-view="library" onclick="switchView('library')">Library</button>
  <button class="view-tab" data-view="builder" onclick="switchView('builder')">Builder</button>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   PromptVault web — single file, offline, localStorage only.
   Data format is identical to the desktop app (version 2), so exports
   can be moved between both.
   ═══════════════════════════════════════════════════════════════════ */

const KEYS = {
  data: "promptvault_v2", settings: "promptvault_settings", templates: "promptvault_templates_v2",
  state: "promptvault_builder_state", history: "promptvault_history", trash: "promptvault_trash",
  backups: "promptvault_backups",
  // Version 1 (bleibt als Sicherheitskopie liegen)
  legacyData: "promptvault_data", legacyFavs: "promptvault_favs", legacyTpl: "promptvault_templates",
};
const DEFAULT_CATEGORIES = ["Clothing", "Hairstyle", "Environment", "Appearance", "Position", "Character"];
const DEFAULT_SETTINGS = {
  theme: "dark", accent: "cyan", fontScale: 1.0, defaultSep: ", ", randomCount: 10,
  confirmDelete: true, catSort: "manual", promptSort: "manual", backupsKeep: 3,
  backupIntervalMin: 10, historyKeep: 100, trashKeep: 200,
};
const ACCENTS = { cyan: "#00d4ff", green: "#22c55e", pink: "#f472b6", orange: "#fb923c", blue: "#60a5fa", gold: "#fbbf24" };
const ACCENTS_LIGHT = { cyan: "#0284c7", green: "#15803d", pink: "#be185d", orange: "#c2410c", blue: "#1d4ed8", gold: "#b45309" };

// ── Helfer ──────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const nowIso = () => new Date().toISOString().slice(0, 19);
const fmtTs = ts => ts ? ts.replace("T", " ").slice(0, 16) : "—";
function uid() {
  const a = new Uint8Array(6); crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
}
function escHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function plural(n, w) { return `${n} ${w}${n !== 1 ? "s" : ""}`; }
function readJSON(key, fallback) {
  try { const v = localStorage.getItem(key); if (v == null) return fallback; return JSON.parse(v); } catch { return fallback; }
}
function writeJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) {
    // Speicher voll: Backups opfern, dann noch einmal versuchen
    try { localStorage.removeItem(KEYS.backups); localStorage.setItem(key, JSON.stringify(val)); showToast("Storage nearly full — backups dropped"); return true; }
    catch { showToast("Storage full! Export your data now."); return false; }
  }
}
function normalizeTags(tags) {
  if (typeof tags === "string") tags = tags.split(/[,\n;]+/);
  const out = [];
  for (let t of tags || []) { t = String(t).trim().toLowerCase().replace(/^#/, ""); if (t && !out.includes(t)) out.push(t); }
  return out;
}
function makePrompt(text, extra = {}) {
  return Object.assign({ id: uid(), text: String(text).trim(), title: "", tags: [], note: "", weight: 5, fav: false,
    uses: 0, last_used: null, created: nowIso(), variants: [], image: null }, extra, { tags: normalizeTags(extra.tags || []) });
}
function normalizePrompt(p) {
  if (typeof p === "string") return makePrompt(p);
  const base = makePrompt(String(p.text || ""));
  for (const k of Object.keys(base)) if (p[k] != null) base[k] = p[k];
  if (!base.id) base.id = uid();
  base.tags = normalizeTags(base.tags);
  base.variants = (base.variants || []).filter(v => typeof v === "string" && v.trim());
  base.weight = Math.max(1, Math.min(10, parseInt(base.weight) || 5));
  base.uses = parseInt(base.uses) || 0;
  return base;
}
const promptTexts = p => [p.text, ...(p.variants || []).filter(Boolean)];
function splitBatch(text) {
  const marker = /(?:^|[\s,;])\s*\d{1,3}\s*[.:)]\s+/;
  if (marker.test("\n" + text))
    return ("\n" + text).split(new RegExp(marker.source, "g")).map(p => p.trim().replace(/^[,;]+|[,;]+$/g, "").trim()).filter(Boolean);

}
function estimateTokens(text) {
  let n = 0;

  }

}
function splitTerms(s) { return (s || "").replace(/;/g, ",").split(",").map(t => t.trim()).filter(Boolean); }
function termsMatch(text, tags, terms) {
  const low = text.toLowerCase();
  return terms.some(t => { t = t.trim().toLowerCase(); return t && (low.includes(t) || tags.includes(t)); });
}
function downloadText(name, text, mime = "text/plain") {
  const blob = new Blob([text], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const safeName = s => s.replace(/[^A-Za-z0-9_\-]+/g, "_").replace(/^_+|_+$/g, "") || "category";

// ── Zustand ─────────────────────────────────────────────────────────
let settings = Object.assign({}, DEFAULT_SETTINGS, readJSON(KEYS.settings, {}));
let data = loadData();
let templates = loadTemplates();
let history = (readJSON(KEYS.history, []) || []).filter(e => e && e.text);
let trash = readJSON(KEYS.trash, []) || [];
let selected = null;
let activeView = "library";
let favFilter = false;
let tagFilter = new Set();
let selection = new Set();
let undoStack = [];
let lastBackup = 0;
let slots = [], rules = [], activeTemplate = null;
let visibleCache = [];

const cats = () => Object.keys(data);

// ── Laden / Migrieren / Speichern ───────────────────────────────────
function loadData() {
  const v2 = readJSON(KEYS.data, null);
  if (v2 && v2.version === 2 && v2.categories && typeof v2.categories === "object") {
    const out = {};
    for (const [c, lst] of Object.entries(v2.categories)) out[c] = (Array.isArray(lst) ? lst : []).map(normalizePrompt);
    return out;
  }
  const v1 = readJSON(KEYS.legacyData, null);
  if (v1 && typeof v1 === "object" && !Array.isArray(v1)) {
    const favs = readJSON(KEYS.legacyFavs, {}) || {};
    const out = {};
    for (const [c, lst] of Object.entries(v1)) {
      if (!Array.isArray(lst)) continue;
      const f = favs[c] || [];
      out[c] = lst.filter(p => typeof p === "string" && p.trim()).map(p => makePrompt(p, { fav: f.includes(p) }));
    }
    writeJSON(KEYS.data, { version: 2, categories: out });
    return out;
  }
  const out = {}; DEFAULT_CATEGORIES.forEach(c => out[c] = []);
  return out;
}
function saveData(backup = true) {
  if (backup) maybeBackup();
  writeJSON(KEYS.data, { version: 2, categories: data });
}
function maybeBackup(force = false) {
  const now = Date.now();
  if (!force && lastBackup && now - lastBackup < settings.backupIntervalMin * 60000) return;
  const cur = localStorage.getItem(KEYS.data); if (!cur) return;
  let b = readJSON(KEYS.backups, []) || [];
  b.unshift({ ts: nowIso(), data: cur });
  b = b.slice(0, Math.max(1, settings.backupsKeep));
  try { localStorage.setItem(KEYS.backups, JSON.stringify(b)); lastBackup = now; }
  catch { b = b.slice(0, 1); try { localStorage.setItem(KEYS.backups, JSON.stringify(b)); } catch {} }
}
function listBackups() { return readJSON(KEYS.backups, []) || []; }
function loadTemplates() {
  const v2 = readJSON(KEYS.templates, null);
  if (v2 && typeof v2 === "object") return v2;
  const old = readJSON(KEYS.legacyTpl, {}) || {};
  const out = {};
  for (const [name, val] of Object.entries(old)) {
    if (!Array.isArray(val)) continue;
    out[name] = { slots: val.map(e => typeof e === "string" ? { type: "cat", cat: e, weight: 100 } : e), rules: [] };
  }
  return out;
}
function saveTemplates() { writeJSON(KEYS.templates, templates); }
function saveSettings() { writeJSON(KEYS.settings, settings); }
function saveHistory() {
  const pinned = history.filter(e => e.pinned), rest = history.filter(e => !e.pinned).slice(0, settings.historyKeep);
  history = [...pinned, ...rest].sort((a, b) => (b.ts || "").localeCompare(a.ts || ""));
  writeJSON(KEYS.history, history);
}
function saveTrash() { trash = trash.slice(0, settings.trashKeep); writeJSON(KEYS.trash, trash); }
let stateTimer;
function saveBuilderState() {
  clearTimeout(stateTimer);
  stateTimer = setTimeout(() => writeJSON(KEYS.state, { slots, rules, sep: $("sep-input").value, template: activeTemplate, wildcard: $("wild-chk").checked }), 600);
}
function restoreBuilderState() {
  const st = readJSON(KEYS.state, {}) || {};
  slots = (st.slots || []).filter(s => s && typeof s === "object").map(normalizeSlot);
  rules = (st.rules || []).filter(r => r && typeof r === "object");
  activeTemplate = st.template || null;
  if (st.sep) $("sep-input").value = st.sep;
  $("wild-chk").checked = !!st.wildcard;
}

// ── Theme ───────────────────────────────────────────────────────────
function hexToRgb(h) { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function blend(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function applyTheme() {
  const light = settings.theme === "light";
  document.documentElement.dataset.theme = light ? "light" : "dark";
  const acc = (light ? ACCENTS_LIGHT : ACCENTS)[settings.accent] || ACCENTS.cyan;
  const r = document.documentElement.style;
  r.setProperty("--acc", acc);
  r.setProperty("--acc-dim", light ? blend(acc, "#ffffff", 0.85) : blend(acc, "#06060f", 0.82));
  r.setProperty("--acc-mid", light ? blend(acc, "#ffffff", 0.7) : blend(acc, "#06060f", 0.65));
  document.body.style.zoom = settings.fontScale || 1;
}

// ── Pop-Menü / Toast / Copy ─────────────────────────────────────────
let ignoreNextClick = false;
function openPopMenu(x, y, items, title = null) {
  const m = $("pop-menu"); m.innerHTML = "";
  if (title) m.appendChild(el("div", "pop-title", title));
  for (const it of items) {
    if (it.sep) { m.appendChild(el("div", "pop-sep")); continue; }
    const b = el("button", it.danger ? "danger" : "", it.label);
    if (it.disabled) b.disabled = true;
    b.addEventListener("click", ev => { ev.stopPropagation(); closePopMenu(); it.action(); });
    m.appendChild(b);
  }
  m.classList.add("show");
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + "px";
  ignoreNextClick = true;
}
function closePopMenu() { $("pop-menu").classList.remove("show"); }
document.addEventListener("click", () => { if (ignoreNextClick) { ignoreNextClick = false; return; } closePopMenu(); });
document.addEventListener("scroll", e => { if (!$("pop-menu").contains(e.target)) closePopMenu(); }, true);
let toastTimer;
function showToast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }
function copyText(text, msg = "Copied!") {
  const done = () => showToast(msg);
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch {} ta.remove(); done();
}

// ── Modal-System ────────────────────────────────────────────────────
let modalClose = null;
function openModal({ title, hint, width, purp, build, buttons = [], onClose }) {
  closeModal();
  const root = $("modal-root"); root.innerHTML = "";
  const m = el("div", "modal"); if (width) m.style.width = width + "px";
  const h = el("div", "modal-header");
  h.appendChild(el("span", "modal-title" + (purp ? " purp" : ""), title));
  if (hint) h.appendChild(el("span", "modal-hint", hint));
  const x = el("button", "modal-x", "✕"); x.onclick = () => closeModal(); h.appendChild(x);
  const body = el("div", "modal-body");
  const foot = el("div", "modal-footer");
  m.append(h, body, foot); root.appendChild(m); root.classList.add("show");
  const close = () => { root.classList.remove("show"); root.innerHTML = ""; modalClose = null; if (onClose) onClose(); };
  modalClose = close;
  const api = { body, foot, close, m };
  for (const b of buttons) {
    const btn = el("button", "btn " + (b.cls || "btn-acc"), b.label);

}
function closeModal() { if (modalClose) modalClose(); }
$("modal-root").addEventListener("mousedown", e => { if (e.target === $("modal-root")) closeModal(); });
function modalOpen() { return $("modal-root").classList.contains("show"); }
function confirmDlg(msg) { return confirm(msg); }

// Namensdialog
function nameDialog(title, initial, onSave, { taken = null, placeholder = "" } = {}) {
  openModal({ title, width: 460, build: ({ body, close }) => {
    const inp = el("input", "inp"); inp.value = initial || ""; inp.placeholder = placeholder; inp.style.width = "100%";
    body.appendChild(inp);

      const name = inp.value.trim(); if (!name) return;
      const t = taken === null ? data : taken;
      if (name !== initial && name in t) { alert(`"${name}" already exists.`); return; }
      close(); onSave(name);
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
    body.parentElement.querySelector(".modal-footer").append(
      Object.assign(el("button", "btn btn-ghost tall", "Cancel"), { onclick: close }),
      Object.assign(el("button", "btn btn-acc", "Save"), { onclick: save }));
  } });
}

// Hervorgehobene Textbox
const HL = [
  [/\((?:[^()]|\([^()]*\))*:\s*-?\d+(?:\.\d+)?\s*\)/y, "hl-w"], [/\(+[^():]*\)+/y, "hl-e"], [/\[[^\[\]]*\]/y, "hl-d"],
  [/__[A-Za-z0-9 _\-\/]+__/y, "hl-x"], [/<[^<>]+>/y, "hl-l"], [/BREAK\b/y, "hl-b"],
];
function highlightHtml(text) {
  let out = "", i = 0;
  while (i < text.length) {
    let hit = null;
    for (const [re, cls] of HL) { re.lastIndex = i; const m = re.exec(text); if (m && m.index === i) { hit = [m[0], cls]; break; } }
    if (hit) { out += `<span class="${hit[1]}">${escHtml(hit[0])}</span>`; i += hit[0].length; }
    else { out += escHtml(text[i]); i++; }
  }
  return out + "\n";
}
function makeHlBox(initial = "", minHeight = 120) {
  const wrap = el("div", "hl-wrap");
  const back = el("pre", "hl-back"); const code = el("code"); back.appendChild(code);
  const ta = el("textarea", "hl-ta"); ta.value = initial; ta.style.minHeight = minHeight + "px"; ta.spellcheck = false;
  wrap.append(back, ta);
  const sync = () => { code.innerHTML = highlightHtml(ta.value); back.scrollTop = ta.scrollTop; };
  ta.addEventListener("input", sync); ta.addEventListener("scroll", () => back.scrollTop = ta.scrollTop);
  sync();
  return { wrap, ta, sync };
}
function attachCounter(ta, label) {
  const upd = () => {
    const t = ta.value, tok = estimateTokens(t);
    label.textContent = `${t.length} chars · ${t.split(/\s+/).filter(Boolean).length} words · ~${tok} tokens` + (tok > 75 ? ` · ${Math.ceil(tok / 75)} chunks of 75` : "");
    label.classList.toggle("warn", tok > 150);
  };
  ta.addEventListener("input", upd); upd(); return upd;
}

// ── Sidebar / Kategorien ────────────────────────────────────────────
function sortedCats() {

  if (settings.catSort === "count") return c.slice().sort((a, b) => data[b].length - data[a].length);

}
let catDragSrc = null;
function renderSidebar() {

    }
    list.appendChild(row);

  for (const cat of sortedCats()) {
    const tab = el("div", "mob-cat" + (cat === selected ? " selected" : ""), cat);

        if (Array.isArray(raw)) { const cat = selected || prompt("Import into category:", cats()[0] || "Imported"); if (!cat) return; incoming[cat] = raw.filter(p => typeof p === "string" || (p && typeof p === "object")).map(normalizePrompt); }
        else if (raw && raw.version === 2 && raw.categories) { for (const [c, l] of Object.entries(raw.categories)) if (Array.isArray(l)) incoming[c] = l.map(normalizePrompt); tpl = raw.templates && typeof raw.templates === "object" ? raw.templates : null; rl = Array.isArray(raw.rules) ? raw.rules : null; }
        else if (raw && typeof raw === "object") { for (const [c, l] of Object.entries(raw)) if (Array.isArray(l)) incoming[c] = l.filter(p => typeof p === "string" || (p && typeof p === "object")).map(normalizePrompt); }
        else throw new Error("format");
      } else {
        const cat = selected || prompt("Import into category:", cats()[0] || "Imported"); if (!cat) return;
        const first = (text.split("\n")[0] || "").toLowerCase().replace(/\s/g, "");
        if ((first.includes(",") || first.includes(";")) && /category|kategorie|text|prompt/.test(first)) {
          const rows = parseCsv(text), head = rows.shift().map(h => h.trim().toLowerCase());
          const col = n => head.indexOf(n);
          for (const r of rows) { const c = (col("category") >= 0 && r[col("category")]) || (col("kategorie") >= 0 && r[col("kategorie")]) || cat; const t = (col("text") >= 0 && r[col("text")]) || (col("prompt") >= 0 && r[col("prompt")]); if (!t) continue; (incoming[c.trim()] = incoming[c.trim()] || []).push(makePrompt(t, { tags: col("tags") >= 0 ? r[col("tags")] || "" : "", title: col("title") >= 0 ? r[col("title")] || "" : "", note: col("note") >= 0 ? r[col("note")] || "" : "" })); }
        } else incoming[cat] = text.split("\n").map(l => l.trim()).filter(Boolean).map(t => makePrompt(t));
      }
    } catch { alert("Could not read this file. Use a PromptVault JSON export, a .txt with one prompt per line, or a CSV with a header row."); return; }
    let added = 0, skipped = 0, newCats = 0;
    const allIds = new Set(cats().flatMap(c => data[c].map(p => p.id)));
    for (const [cat, list] of Object.entries(incoming)) {
      if (!(cat in data)) { data[cat] = []; newCats++; }
      for (const p of list) { if (!p.text) continue; if (isDup(cat, p.text)) { skipped++; continue; } if (allIds.has(p.id)) p.id = uid(); allIds.add(p.id); data[cat].push(p); added++; }
    }
    let tplN = 0;
    if (tpl) { for (const [n, t] of Object.entries(tpl)) if (!(n in templates)) { templates[n] = t; tplN++; } saveTemplates(); }
    if (rl) for (const r of rl) if (!rules.some(x => JSON.stringify(x) === JSON.stringify(r))) rules.push(r);
    saveData(); renderSidebar(); if (!selected && cats().length) selectCat(cats()[0]); else refresh();
    alert(`${plural(added, "prompt")} added\n${plural(skipped, "duplicate")} skipped\n${newCats} new categor${newCats !== 1 ? "ies" : "y"}` + (tplN ? `\n${plural(tplN, "template")} added` : ""));
  };
  reader.readAsText(file);
}

// ══ SHORTCUTS ═══════════════════════════════════════════════════════
const isTyping = e => e.target.matches("input, textarea, select");
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (e.key === "Escape") { if (modalOpen()) closeModal(); else if ($("search").value) { $("search").value = ""; renderPrompts(); } else if (selection.size) { selection.clear(); renderPrompts(); } closePopMenu(); return; }
  if (e.key === "F1") { e.preventDefault(); if (!modalOpen()) openShortcuts(); return; }
  if (modalOpen()) return;
  if (mod && k === "z" && !isTyping(e)) { e.preventDefault(); undo(); return; }
  if (mod && k === "f") { e.preventDefault(); switchView("library"); $("search").focus(); return; }
  if (isTyping(e)) return;
  if (mod && k === "n") { e.preventDefault(); if (e.shiftKey) newCategory(); else { switchView("library"); addPrompt(); } return; }
  if (mod && k === "a" && activeView === "library") { e.preventDefault(); selectAllVisible(); return; }
  if (e.key === "Delete" && activeView === "library" && selection.size) { deletePrompts([...selection]); return; }
  if (mod && k === "c" && !window.getSelection().toString()) { if (activeView === "builder") copyResult(); else if (selection.size) copyPrompts([...selection]); return; }
  if (mod && k === "l") { e.preventDefault(); switchView("library"); return; }
  if (mod && k === "b") { e.preventDefault(); switchView("builder"); return; }
  if (mod && e.key === ",") { e.preventDefault(); openSettings(); return; }
  if (mod && k === "d") { e.preventDefault(); openDuplicates(); return; }
  if (mod && k === "t") { e.preventDefault(); openTrash(); return; }
  if (mod && /^[1-9]$/.test(e.key)) { const c = sortedCats()[parseInt(e.key) - 1]; if (c) { e.preventDefault(); switchView("library"); selectCat(c); } return; }
  if (e.key === " " && activeView === "builder") { e.preventDefault(); randomizeAll(); }
});
let searchTimer;
$("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderPrompts, 200); });

// ══ INIT ════════════════════════════════════════════════════════════
applyTheme();
$("sort-sel").value = settings.promptSort || "manual";
$("sep-input").value = settings.defaultSep || ", ";
restoreBuilderState();
renderSidebar();
selectCat(cats()[0] || null);
window.addEventListener("beforeunload", () => { clearTimeout(stateTimer); writeJSON(KEYS.state, { slots, rules, sep: $("sep-input").value, template: activeTemplate, wildcard: $("wild-chk").checked }); });
</script>
