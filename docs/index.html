<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #06060f;
    --surf:     #0b0b1a;
    --surf2:    #0f0f22;
    --surf3:    #14142e;
    --border:   #1c1c38;
    --bord-h:   #2c2c55;
    --cyan:     #00d4ff;
    --cyan-dim: #002233;
    --cyan-mid: #004d66;
    --purp:     #a78bfa;
    --purp-dim: #1a0d40;
    --purp-mid: #3d2080;
    --red:      #f87171;
    --red-dim:  #1e0808;
    --red-mid:  #4a1010;
    --gold:     #fbbf24;
    --gold-dim: #2a2008;
    --txt:      #dce4f5;
    --txt2:     #4a5a78;
    --txt3:     #222840;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--txt);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ══════════════════════════════════════════
     SIDEBAR (desktop)
  ══════════════════════════════════════════ */
  #sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--surf);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #logo {
    height: 80px;
    min-height: 80px;
    padding: 18px 18px 0;
    border-bottom: 1px solid var(--border);
  }
  #logo .logo-line { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
  #logo .logo-line span:first-child { color: var(--cyan); }
  #logo .logo-line span:last-child  { color: var(--purp); }
  #logo .logo-sub { font-size: 9px; color: var(--txt2); margin-top: 4px; }

  /* View-Tabs (Library / Builder) */
  #view-tabs { display: flex; gap: 6px; padding: 10px 10px 0; }
  .view-tab {
    flex: 1; height: 30px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surf2);
    color: var(--txt2); font-size: 11px; font-weight: bold;
    cursor: pointer; transition: all 0.15s;
  }
  .view-tab:hover { background: var(--surf3); }
  .view-tab.active { background: var(--purp-dim); border-color: var(--purp); color: var(--purp); }

  #cat-label {
    font-size: 9px; font-weight: bold; color: var(--txt3);
    padding: 10px 18px 4px; letter-spacing: 1px;
  }

  #cat-list {
    flex: 1; overflow-y: auto; padding: 4px 6px;
  }
  #cat-list::-webkit-scrollbar { width: 4px; }
  #cat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .cat-row {
    display: flex; align-items: center; height: 38px;
    border-radius: 6px; margin: 2px 0; cursor: pointer;
    background: var(--surf); transition: background 0.15s;
  }
  .cat-row:hover { background: var(--surf3); }
  .cat-row.selected { background: var(--surf3); }

  .cat-bar {
    width: 3px; height: 26px; border-radius: 2px;
    background: transparent; margin: 0 6px 0 4px; flex-shrink: 0;
    transition: background 0.15s;
  }
  .cat-row.selected .cat-bar { background: var(--cyan); }

  .cat-name { flex: 1; font-size: 13px; color: var(--txt); transition: color 0.15s; }
  .cat-row.selected .cat-name { color: var(--cyan); }

  .cat-badge {
    font-size: 10px; font-weight: bold; color: var(--txt2);
    background: var(--surf3); padding: 2px 7px; border-radius: 10px;
    margin-right: 8px; transition: color 0.15s, background 0.15s;
  }
  .cat-row.selected .cat-badge { color: var(--cyan); background: var(--cyan-dim); }

  /* Sidebar footer: import / export */
  #sidebar-footer {
    border-top: 1px solid var(--border);
    padding: 10px 10px;
    display: flex;
    gap: 6px;
  }
  #sidebar-footer button {
    flex: 1; height: 32px; border-radius: 8px; border: 1px solid var(--bord-h);
    background: transparent; color: var(--txt2); font-size: 11px;
    cursor: pointer; transition: background 0.15s;
  }
  #sidebar-footer button:hover { background: var(--surf3); color: var(--txt); }
  #sidebar-footer .btn-exp { border-color: var(--cyan-mid); color: var(--cyan); }
  #sidebar-footer .btn-exp:hover { background: var(--cyan-dim); }

  /* ══════════════════════════════════════════
     CONTENT
  ══════════════════════════════════════════ */
  #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  #lib-view, #builder-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #lib-view.hidden, #builder-view.hidden { display: none; }

  #topbar, #b-topbar {
    min-height: 66px; background: var(--surf);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0 18px 0 22px; gap: 10px; flex-wrap: wrap;
  }

  #top-left, #top-left-b { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  #title-lbl, #b-title { font-size: 17px; font-weight: bold; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #count-lbl, #b-sub { font-size: 10px; color: var(--txt2); margin-top: 2px; }

  #top-right, #b-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  #all-wrap {
    display: flex; align-items: center; gap: 5px;
    color: var(--txt2); font-size: 11px; cursor: pointer; user-select: none;
  }
  #all-wrap input { accent-color: var(--cyan); cursor: pointer; }

  input#search {
    background: var(--surf2); border: 1px solid var(--bord-h);
    border-radius: 10px; color: var(--txt); font-size: 12px;
    padding: 0 14px; height: 34px; width: 160px; outline: none;
    transition: border-color 0.15s;
  }
  input#search::placeholder { color: var(--txt2); }
  input#search:focus { border-color: var(--cyan); }

  /* ══════════════════════════════════════════
     BUTTONS
  ══════════════════════════════════════════ */
  .btn {
    height: 34px; border-radius: 10px; border: 1px solid;
    font-weight: bold; font-size: 13px; cursor: pointer;
    padding: 0 16px; transition: background 0.15s; white-space: nowrap;
  }
  .btn:disabled { opacity: 0.35; cursor: default; }

  .btn-cyan  { background: var(--cyan-dim);  border-color: var(--cyan);  color: var(--cyan); }
  .btn-cyan:not(:disabled):hover  { background: var(--cyan-mid); }
  .btn-purp  { background: var(--purp-dim);  border-color: var(--purp);  color: var(--purp); }
  .btn-purp:not(:disabled):hover  { background: var(--purp-mid); }
  .btn-gold  { background: var(--gold-dim);  border-color: var(--gold);  color: var(--gold); }
  .btn-gold:not(:disabled):hover  { background: #3d3010; }
  .fav-on { border-color: var(--gold) !important; color: var(--gold) !important; background: var(--gold-dim) !important; }

  .btn-ghost {
    background: transparent; border-color: var(--bord-h); color: var(--txt2);
    font-size: 11px; height: 26px; border-radius: 8px; padding: 0 10px; font-weight: normal;
  }
  .btn-ghost:hover { background: var(--surf3); }
  .btn-ghost-purp {
    background: transparent; border-color: var(--bord-h); color: var(--purp);
    font-size: 11px; height: 26px; border-radius: 8px; padding: 0 10px; font-weight: normal;
  }
  .btn-ghost-purp:hover { background: var(--purp-dim); }
  .btn-danger {
    background: var(--red-dim); border-color: var(--red); color: var(--red);
    font-size: 11px; height: 26px; border-radius: 8px; padding: 0 10px; font-weight: normal;
  }
  .btn-danger:hover { background: var(--red-mid); }

  /* ══════════════════════════════════════════
     PROMPT LIST
  ══════════════════════════════════════════ */
  #list-wrap, #slot-wrap { flex: 1; overflow-y: auto; padding: 12px 14px; }
  #list-wrap::-webkit-scrollbar, #slot-wrap::-webkit-scrollbar { width: 6px; }
  #list-wrap::-webkit-scrollbar-thumb, #slot-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .empty-msg { color: var(--txt2); font-size: 13px; text-align: center; margin-top: 60px; line-height: 1.7; }

  .card {
    background: var(--surf2); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 10px; overflow: hidden;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px 4px;
  }
  .card-num { font-family: Consolas, monospace; font-size: 10px; font-weight: bold; color: var(--cyan); }
  .card-btns { display: flex; gap: 4px; flex-wrap: wrap; }
  .card-divider { height: 1px; background: var(--border); margin: 2px 12px; }
  .card-text {
    font-family: Consolas, monospace; font-size: 12px; color: var(--txt);
    padding: 4px 12px 10px; line-height: 1.5; word-break: break-word;
  }
  .card-cat {
    font-size: 10px; color: var(--purp); background: var(--purp-dim);
    padding: 2px 8px; border-radius: 10px; margin-left: 8px; white-space: nowrap;
  }

  /* ══════════════════════════════════════════
     BUILDER (Baukasten)
  ══════════════════════════════════════════ */
  .slot-card {
    background: var(--surf2); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 10px; overflow: hidden;
  }
  .slot-card.locked { border-color: var(--gold); }
  .slot-head { display: flex; align-items: center; gap: 4px; padding: 8px 12px 4px; flex-wrap: wrap; }
  .slot-idx { font-family: Consolas, monospace; font-size: 10px; font-weight: bold; color: var(--purp); }
  .slot-name { font-size: 12px; font-weight: bold; color: var(--txt); flex: 1; min-width: 70px; margin-left: 4px; }
  .slot-name.txt { color: var(--gold); }
  .slot-val {
    font-family: Consolas, monospace; font-size: 12px; color: var(--txt);
    padding: 4px 12px 10px; line-height: 1.5; word-break: break-word;
  }
  .slot-val.none { color: var(--txt2); font-style: italic; }

  #result-bar {
    background: var(--surf); border-top: 1px solid var(--border);
    padding: 10px 14px; flex-shrink: 0;
  }
  #result-text {
    font-family: Consolas, monospace; font-size: 12px; color: var(--txt);
    background: var(--surf2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 8px; min-height: 36px;
    max-height: 110px; overflow-y: auto; word-break: break-word;
  }
  #result-text.empty { color: var(--txt2); font-style: italic; }
  #result-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sep-lbl { font-size: 10px; color: var(--txt2); }
  #sep-input {
    background: var(--surf2); border: 1px solid var(--bord-h); border-radius: 8px;
    color: var(--txt); font-size: 12px; height: 30px; width: 70px;
    text-align: center; outline: none;
  }
  #sep-input:focus { border-color: var(--cyan); }

  /* ══════════════════════════════════════════
     MODALS
  ══════════════════════════════════════════ */
  .overlay {
    position: fixed; inset: 0; background: rgba(2,2,8,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 12px;
  }
  .overlay.hidden { display: none; }

  .modal {
    background: var(--surf); border: 1px solid var(--bord-h);
    border-radius: 14px; display: flex; flex-direction: column;
    overflow: hidden; max-height: 95vh; max-width: 100%;
  }
  .modal-header {
    background: var(--surf2); padding: 14px 18px;
    font-size: 14px; font-weight: bold; color: var(--cyan); flex-shrink: 0;
  }
  .modal textarea {
    background: var(--surf2); border: 1px solid var(--bord-h);
    border-radius: 10px; color: var(--txt);
    font-family: Consolas, monospace; font-size: 13px;
    resize: none; outline: none; padding: 10px 12px;
    margin: 14px 18px 8px; flex: 1; min-height: 160px;
  }
  .modal textarea:focus { border-color: var(--cyan); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 8px 18px 16px; flex-shrink: 0;
  }
  .modal-footer .btn { font-size: 12px; height: 34px; }

  /* Random modal */
  #rnd-modal { width: min(800px, 100%); height: min(680px, 92vh); }
  .rnd-ctrl {
    background: var(--surf2); border: 1px solid var(--border);
    border-radius: 10px; display: flex; align-items: flex-end;
    padding: 8px 14px 12px; margin: 10px 18px; flex-wrap: wrap; gap: 12px;
  }
  .rnd-ctrl label { font-size: 10px; color: var(--txt2); display: block; margin-bottom: 4px; }
  .rnd-ctrl select {
    background: var(--surf3); border: 1px solid var(--bord-h);
    border-radius: 8px; color: var(--txt); font-size: 13px;
    padding: 0 10px; height: 34px; width: 180px; outline: none; cursor: pointer;
  }
  .rnd-ctrl input[type=number] {
    background: var(--surf3); border: 1px solid var(--bord-h);
    border-radius: 8px; color: var(--cyan); font-size: 14px; font-weight: bold;
    text-align: center; height: 34px; width: 65px; outline: none; padding: 0;
  }
  .rnd-ctrl input[type=number]::-webkit-inner-spin-button { display: none; }
  #rnd-info { font-size: 10px; color: var(--txt2); text-align: center; margin: 0 18px 2px; min-height: 16px; }
  #rnd-results { flex: 1; overflow-y: auto; margin: 0 18px 8px; padding-right: 4px; }
  #rnd-results::-webkit-scrollbar { width: 5px; }
  #rnd-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #rnd-footer {
    background: var(--surf2); display: flex; justify-content: flex-end;
    align-items: center; gap: 8px; padding: 8px 16px; flex-shrink: 0;
  }

  /* Editor modal */
  #editor-modal { width: min(680px, 100%); }
  #editor-hint { font-size: 10px; color: var(--txt2); padding: 8px 18px 0; }
  #editor-hint:empty { display: none; }

  /* Name modal (new/rename category) */
  #name-modal { width: min(420px, 100%); }
  #name-modal input {
    background: var(--surf2); border: 1px solid var(--bord-h);
    border-radius: 10px; color: var(--txt); font-size: 13px;
    height: 36px; padding: 0 12px; margin: 14px 18px 8px; outline: none;
  }
  #name-modal input:focus { border-color: var(--cyan); }

  /* Pick + History modals */
  #pick-modal, #hist-modal { width: min(680px, 100%); height: min(600px, 92vh); }
  #pick-search {
    background: var(--surf2); border: 1px solid var(--bord-h);
    border-radius: 10px; color: var(--txt); font-size: 12px;
    height: 34px; padding: 0 12px; margin: 12px 18px 4px; outline: none;
  }
  #pick-search:focus { border-color: var(--cyan); }
  #pick-list, #hist-list { flex: 1; overflow-y: auto; margin: 8px 18px; }
  #pick-list::-webkit-scrollbar, #hist-list::-webkit-scrollbar { width: 5px; }
  #pick-list::-webkit-scrollbar-thumb, #hist-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .pick-item {
    background: var(--surf2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 6px; font-family: Consolas, monospace;
    font-size: 12px; cursor: pointer; word-break: break-word; transition: border-color 0.15s;
  }
  .pick-item:hover { border-color: var(--cyan); }

  /* New category button */
  #new-cat-wrap { padding: 8px 10px 0; }
  #new-cat-btn {
    width: 100%; height: 32px; border-radius: 8px;
    border: 1px solid var(--cyan-mid); background: transparent;
    color: var(--cyan); font-size: 11px; cursor: pointer;
    transition: background 0.15s;
  }
  #new-cat-btn:hover { background: var(--cyan-dim); }

  /* Category context menu + generic pop menu */
  #ctx-menu, #pop-menu {
    position: fixed; z-index: 300; display: none; min-width: 170px;
    background: var(--surf2); border: 1px solid var(--bord-h);
    border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  #pop-menu { max-height: 60vh; overflow-y: auto; }
  #ctx-menu.show, #pop-menu.show { display: block; }
  #ctx-menu button, #pop-menu button {
    display: block; width: 100%; text-align: left;
    background: transparent; border: none; color: var(--txt);
    font-size: 12px; padding: 9px 14px; cursor: pointer;
  }
  #ctx-menu button:hover, #pop-menu button:hover { background: var(--surf3); color: var(--cyan); }
  #ctx-menu button.danger:hover, #pop-menu button.danger:hover { background: var(--red-dim); color: var(--red); }
  .pop-title { font-size: 9px; font-weight: bold; color: var(--txt2); padding: 8px 14px 4px; letter-spacing: 1px; }
  .pop-sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* Toast */
  #toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--cyan-mid); border: 1px solid var(--cyan);
    color: var(--cyan); font-size: 12px; padding: 8px 20px;
    border-radius: 20px; opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ══════════════════════════════════════════
     MOBILE  (≤ 700px)
  ══════════════════════════════════════════ */
  #mob-header { display: none; }
  #mob-tabs   { display: none; }
  #mob-cats   { display: none; }

  @media (max-width: 700px) {
    body { flex-direction: column; overflow: hidden; }

    /* hide desktop sidebar */
    #sidebar { display: none; }

    /* mobile header bar */
    #mob-header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surf); border-bottom: 1px solid var(--border);
      padding: 10px 14px; flex-shrink: 0;
    }
    #mob-header .logo-line { font-size: 15px; font-weight: bold; }
    #mob-header .logo-line span:first-child { color: var(--cyan); }
    #mob-header .logo-line span:last-child  { color: var(--purp); }
    #mob-header .mob-io { display: flex; gap: 6px; }
    #mob-header .mob-io button {
      height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--bord-h);
      background: transparent; color: var(--txt2); font-size: 11px; cursor: pointer;
    }
    #mob-header .mob-io .btn-exp { border-color: var(--cyan-mid); color: var(--cyan); }

    /* view tabs (Library / Builder) */
    #mob-tabs {
      display: flex; gap: 6px; padding: 8px 10px 0;
      background: var(--surf); flex-shrink: 0;
    }

    /* horizontal category tabs */
    #mob-cats {
      display: flex; overflow-x: auto; gap: 6px;
      padding: 8px 10px; background: var(--surf);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #mob-cats::-webkit-scrollbar { display: none; }
    .mob-cat {
      white-space: nowrap; padding: 5px 14px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--surf2);
      color: var(--txt2); font-size: 12px; cursor: pointer;
      flex-shrink: 0; transition: all 0.15s;
    }
    .mob-cat.selected {
      background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan);
    }

    /* topbar stacks */
    #topbar, #b-topbar {
      padding: 10px 12px; gap: 8px; min-height: unset;
    }
    #top-left, #top-left-b { display: none; }
    #top-right, #b-right { width: 100%; justify-content: flex-end; }
    input#search { flex: 1; min-width: 0; width: auto; }

    .btn { font-size: 12px; padding: 0 12px; }

    /* cards: bigger touch targets */
    .card-header { padding: 10px 12px 6px; }
    .btn-ghost, .btn-ghost-purp, .btn-danger { height: 30px; font-size: 11px; padding: 0 10px; }

    /* modals full-screen on mobile */
    .overlay { padding: 0; align-items: flex-end; }
    .modal { border-radius: 14px 14px 0 0; max-height: 90vh; width: 100%; }
    #rnd-modal { height: 90vh; width: 100%; }
    #editor-modal { width: 100%; }
    .rnd-ctrl select { width: 140px; }
  }
</style>
</head>
<body>

<!-- ── MOBILE HEADER ── -->
<div id="mob-header">
  <div class="logo-line"><span>PROMPT</span><span>VAULT</span></div>
  <div class="mob-io">
    <button onclick="importJSON()">&#8593; Import</button>
    <button class="btn-exp" onclick="exportJSON()">&#8595; Export</button>
  </div>
</div>

<!-- ── MOBILE VIEW TABS ── -->
<div id="mob-tabs">
  <button class="view-tab active" data-view="library" onclick="switchView('library')">Library</button>
  <button class="view-tab" data-view="builder" onclick="switchView('builder')">Builder</button>
</div>

<!-- ── MOBILE CATEGORY TABS ── -->
<div id="mob-cats"></div>

<!-- ── SIDEBAR (desktop) ── -->
<aside id="sidebar">
  <div id="logo">
    <div class="logo-line"><span>PROMPT</span><span>VAULT</span></div>
    <div class="logo-sub">Image Generation</div>
  </div>
  <div id="view-tabs">
    <button class="view-tab active" data-view="library" onclick="switchView('library')">Library</button>
    <button class="view-tab" data-view="builder" onclick="switchView('builder')">Builder</button>
  </div>
  <div id="cat-label">CATEGORIES</div>
  <div id="cat-list"></div>
  <div id="new-cat-wrap">
    <button id="new-cat-btn" onclick="newCategory()">+ New Category</button>
  </div>
  <div id="sidebar-footer">
    <button onclick="importJSON()">&#8593; Import</button>
    <button class="btn-exp" onclick="exportJSON()">&#8595; Export</button>
  </div>
</aside>

<!-- ── CONTENT ── -->
<main id="content">

  <!-- Library view -->
  <div id="lib-view">
    <div id="topbar">
      <div id="top-left">

<input type="file" id="file-input" accept=".json" style="display:none" onchange="handleImport(event)">

<!-- ── TOAST ── -->
<div id="toast">Copied!</div>

<script>
const DEFAULT_CATEGORIES = ["Clothing", "Hairstyle", "Environment", "Appearance", "Position", "Character"];
const STORAGE_KEY = "promptvault_data";
const BACKUP_KEY  = "promptvault_data_backup";

// ── Data ──────────────────────────────────────────────────────────────────────

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d === "object" && !Array.isArray(d)) return d;
    }
  } catch {}
  const d = {};
  DEFAULT_CATEGORIES.forEach(c => d[c] = []);
  return d;
}

function saveData(data) {
  // Sicherheitskopie der letzten Version, dann speichern
  const cur = localStorage.getItem(STORAGE_KEY);
  if (cur !== null) localStorage.setItem(BACKUP_KEY, cur);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function cats() { return Object.keys(data); }

function splitBatch(text) {
  const marker = /(?:^|[\s,;])\s*\d{1,3}\s*[.:)]\s+/;
  if (marker.test("\n" + text)) {
    return ("\n" + text).split(new RegExp(marker.source, "g"))
      .map(p => p.trim().replace(/^[,;]+|[,;]+$/g, "").trim())
      .filter(Boolean);
  }
  return text.split("\n").map(l => l.trim()).filter(Boolean);
}

let data = loadData();
let selected = null;
let editIndex = null;
let editCat = null;
let batchMode = false;
let editorCallback = null;   // Editor-Modal als generischer Texteditor (Builder-Textslots)
let lastRndResults = [];

// ── Favoriten ─────────────────────────────────────────────────────────────────

const FAVS_KEY = "promptvault_favs";
const TPL_KEY  = "promptvault_templates";

function loadJSON(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    if (v && typeof v === "object" && !Array.isArray(v)) return v;
  } catch {}
  return fallback;
}

let favs = loadJSON(FAVS_KEY, {});

function saveFavs() {
  for (const k of Object.keys(favs)) if (!favs[k] || !favs[k].length) delete favs[k];
  localStorage.setItem(FAVS_KEY, JSON.stringify(favs));
}

function isFav(cat, p) { return (favs[cat] || []).includes(p); }

function toggleFav(cat, p) {
  const l = favs[cat] || (favs[cat] = []);
  const i = l.indexOf(p);
  if (i >= 0) l.splice(i, 1); else l.push(p);
  saveFavs();
  renderPrompts();
}

let favFilter = false;

function toggleFavFilter() {
  favFilter = !favFilter;
  const b = document.getElementById("fav-btn");
  b.innerHTML = favFilter ? "&#9733;" : "&#9734;";
  b.classList.toggle("fav-on", favFilter);
  renderPrompts();
}

// ── Undo ──────────────────────────────────────────────────────────────────────

let undoStack = [];   // ["prompt", cat, index, text, wasFav] | ["category", name, prompts, favList, pos]

function pushUndo(entry) {
  undoStack.push(entry);
  if (undoStack.length > 20) undoStack.shift();
}

function undo() {
  const e = undoStack.pop();
  if (!e) { showToast("Nothing to undo"); return; }
  if (e[0] === "prompt") {
    const [, cat, index, text, wasFav] = e;
    if (!Array.isArray(data[cat])) data[cat] = [];
    data[cat].splice(Math.min(index, data[cat].length), 0, text);
    if (wasFav && !isFav(cat, text)) { (favs[cat] || (favs[cat] = [])).push(text); saveFavs(); }
    saveData(data);
    refresh();
    showToast("Prompt restored");
  } else {
    const [, name, prompts, favList, pos] = e;
    if (name in data) { showToast(`Category "${name}" already exists`); return; }
    const entries = Object.entries(data);
    entries.splice(Math.min(pos, entries.length), 0, [name, prompts]);
    data = Object.fromEntries(entries);
    if (favList.length) { favs[name] = favList; saveFavs(); }
    saveData(data);
    selectCat(name);
    showToast(`Category "${name}" restored`);
  }
}

// ── Builder-Status ────────────────────────────────────────────────────────────

let slots = [];        // {type:"cat"|"text", cat, text, value, locked, weight}
let histArr = [];      // letzte Ergebnisse (nur im Speicher, max. 20)
let activeView = "library";
let templates = loadJSON(TPL_KEY, {});

function saveTemplates() { localStorage.setItem(TPL_KEY, JSON.stringify(templates)); }

// ── Sidebar + Mobile tabs ─────────────────────────────────────────────────────

function attachCatMenu(el, cat) {
  el.addEventListener("contextmenu", e => {
    e.preventDefault();
    openCtxMenu(e.clientX, e.clientY, cat);
  });
  // Long-press für Touch-Geräte
  let pressTimer = null;
  el.addEventListener("touchstart", e => {
    const t = e.touches[0];
    pressTimer = setTimeout(() => {
      ignoreNextClick = true;
      openCtxMenu(t.clientX, t.clientY, cat);
    }, 600);
  }, { passive: true });
  ["touchend", "touchmove", "touchcancel"].forEach(ev =>
    el.addEventListener(ev, () => clearTimeout(pressTimer), { passive: true }));
}

function renderSidebar() {
  // Desktop sidebar
  const list = document.getElementById("cat-list");
  list.innerHTML = "";
  for (const cat of cats()) {
    const count = (data[cat] || []).length;
    const sel = cat === selected;
    const row = document.createElement("div");
    row.className = "cat-row" + (sel ? " selected" : "");
    row.innerHTML = `
      <div class="cat-bar"></div>
      <div class="cat-name">${escHtml(cat)}</div>
      <div class="cat-badge">${count}</div>`;
    row.onclick = () => selectCat(cat);
    attachCatMenu(row, cat);
    list.appendChild(row);
  }

  // Mobile tabs
  const tabs = document.getElementById("mob-cats");
  tabs.innerHTML = "";
  for (const cat of cats()) {
    const tab = document.createElement("div");
    tab.className = "mob-cat" + (cat === selected ? " selected" : "");
    tab.textContent = cat;
    tab.onclick = () => selectCat(cat);
    attachCatMenu(tab, cat);
    tabs.appendChild(tab);
  }
  const plus = document.createElement("div");
  plus.className = "mob-cat";
  plus.textContent = "+";
  plus.onclick = newCategory;
  tabs.appendChild(plus);
}

function selectCat(cat) {
  selected = cat;
  switchView("library");
  document.getElementById("search").value = "";
  if (!cat) {
    document.getElementById("title-lbl").textContent = "Select a category";
    document.getElementById("count-lbl").textContent = "";
    document.getElementById("add-btn").disabled = true;
    document.getElementById("batch-btn").disabled = true;
    document.getElementById("rnd-btn").disabled = true;
    renderSidebar();
    renderPrompts();
    return;
  }
  document.getElementById("title-lbl").textContent = cat;
  const n = (data[cat] || []).length;
  document.getElementById("count-lbl").textContent = n + " Prompt" + (n !== 1 ? "s" : "");
  document.getElementById("add-btn").disabled = false;
  document.getElementById("batch-btn").disabled = false;
  document.getElementById("rnd-btn").disabled = n === 0;
  renderSidebar();
  renderPrompts();
}

// ── Kategorien: anlegen / umbenennen / löschen ───────────────────────────────

let ctxCat = null;
let nameMode = null;        // "new" | "rename"
let ignoreNextClick = false;

function openCtxMenu(x, y, cat) {
  ctxCat = cat;
  const m = document.getElementById("ctx-menu");
  m.classList.add("show");
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, window.innerWidth  - r.width  - 8) + "px";
  m.style.top  = Math.min(y, window.innerHeight - r.height - 8) + "px";
}

function closeCtxMenu() {
  document.getElementById("ctx-menu").classList.remove("show");
}

document.addEventListener("click", () => {
  if (ignoreNextClick) { ignoreNextClick = false; return; }
  closeCtxMenu();
  closePopMenu();
});
document.addEventListener("scroll", e => {
  closeCtxMenu();
  if (!document.getElementById("pop-menu").contains(e.target)) closePopMenu();
}, true);

// ── Generisches Pop-Menü ──────────────────────────────────────────────────────
// items: [{label, action, danger?} | {sep:true}]

function openPopMenu(x, y, items, title = null) {
  const m = document.getElementById("pop-menu");
  m.innerHTML = "";
  if (title) {
    const h = document.createElement("div");
    h.className = "pop-title";
    h.textContent = title;
    m.appendChild(h);
  }
  for (const it of items) {
    if (it.sep) {
      const s = document.createElement("div");
      s.className = "pop-sep";
      m.appendChild(s);
      continue;
    }
    const b = document.createElement("button");
    b.textContent = it.label;
    if (it.danger) b.className = "danger";
    b.addEventListener("click", ev => {
      ev.stopPropagation();
      closePopMenu();
      it.action();
    });
    m.appendChild(b);
  }
  m.classList.add("show");
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, window.innerWidth  - r.width  - 8)) + "px";
  m.style.top  = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + "px";
  ignoreNextClick = true;
}

function closePopMenu() {
  document.getElementById("pop-menu").classList.remove("show");
}

function newCategory() {
  nameMode = "new";
  openNameModal("New Category", "");
}

function ctxRename() {
  nameMode = "rename";
  openNameModal(`Rename "${ctxCat}"`, ctxCat);
}

function ctxDelete() {
  const n = (data[ctxCat] || []).length;
  if (!confirm(`Delete "${ctxCat}" with ${n} prompt${n !== 1 ? "s" : ""}?`)) return;
  pushUndo(["category", ctxCat, data[ctxCat] || [], favs[ctxCat] || [], cats().indexOf(ctxCat)]);
  delete data[ctxCat];
  delete favs[ctxCat];
  saveFavs();
  saveData(data);
  if (selected === ctxCat) selected = null;
  selectCat(selected || cats()[0] || null);
  showToast("Deleted — Ctrl+Z to undo");
}

function openNameModal(title, initial) {
  document.getElementById("name-title").textContent = title;
  const inp = document.getElementById("name-input");
  inp.value = initial;
  document.getElementById("name-overlay").classList.remove("hidden");
  inp.focus();
}

function closeNameModal() {
  document.getElementById("name-overlay").classList.add("hidden");
}

function nameOverlayClick(e) {
  if (e.target === document.getElementById("name-overlay")) closeNameModal();
}

function saveNameModal() {
  const name = document.getElementById("name-input").value.trim();
  if (!name) return;
  if (nameMode === "template") {
    if (name in templates && !confirm(`Overwrite template "${name}"?`)) return;
    closeNameModal();
    saveTemplate(name);
    return;
  }
  if (name in data && !(nameMode === "rename" && name === ctxCat)) {
    alert(`Category "${name}" already exists.`);
    return;
  }
  closeNameModal();
  if (nameMode === "new") {
    data[name] = [];
    saveData(data);
    selectCat(name);
  } else if (nameMode === "rename" && name !== ctxCat) {
    const renamed = {};
    for (const k of cats()) renamed[k === ctxCat ? name : k] = data[k];
    data = renamed;
    if (favs[ctxCat]) { favs[name] = favs[ctxCat]; delete favs[ctxCat]; saveFavs(); }
    saveData(data);
    if (selected === ctxCat) selected = name;
    selectCat(selected);
  }
}

// ── Prompt List ───────────────────────────────────────────────────────────────

function renderPrompts() {
  const wrap = document.getElementById("list-wrap");
  wrap.innerHTML = "";
  const allMode = document.getElementById("all-chk").checked;
  if (!allMode && !selected) {
    wrap.innerHTML = '<p class="empty-msg">&#8592; Select a category on the left</p>';
    return;
  }
  const q = document.getElementById("search").value.trim().toLowerCase();

  // (cat, index, prompt)-Tripel sammeln — global oder nur aktuelle Kategorie
  const filtered = [];
  for (const cat of (allMode ? cats() : [selected])) {
    (data[cat] || []).forEach((p, i) => {
      if (q && !p.toLowerCase().includes(q)) return;
      if (favFilter && !isFav(cat, p)) return;
      filtered.push({ cat, i, p });
    });
  }

  if (filtered.length === 0) {
    const raw = document.getElementById("search").value;
    let msg = "No prompts yet.\nClick  + Prompt  to add one.";
    if (q) msg = `No results for "${raw}"`;
    else if (favFilter) msg = "No favorites yet.\nClick ☆ on a prompt to mark it.";
    wrap.innerHTML = `<p class="empty-msg">${escHtml(msg).replace(/\n/g, "<br>")}</p>`;
    return;
  }

  filtered.forEach(({ cat, i, p }, n) => {
    const card = document.createElement("div");
    card.className = "card";

    const header = document.createElement("div");
    header.className = "card-header";

    const left = document.createElement("span");
    left.style.cssText = "display:flex;align-items:center;min-width:0;";
    const num = document.createElement("span");
    num.className = "card-num";
    num.textContent = "#" + String((allMode ? n : i) + 1).padStart(2, "0");
    left.appendChild(num);
    if (allMode) {
      const badge = document.createElement("span");
      badge.className = "card-cat";
      badge.textContent = cat;
      left.appendChild(badge);
    }

    const btns = document.createElement("div");
    btns.className = "card-btns";
    const mk = (label, cls, fn) => {
      const b = document.createElement("button");
      b.className = "btn " + cls;
      b.textContent = label;
      b.addEventListener("click", fn);
      btns.appendChild(b);
      return b;
    };
    const fav = isFav(cat, p);
    const favB = mk(fav ? "★" : "☆", "btn-ghost", () => toggleFav(cat, p));
    if (fav) favB.classList.add("fav-on");
    mk("Copy", "btn-ghost", () => copyText(p));
    mk("Move", "btn-ghost", e => openMoveMenu(e, cat, i));
    mk("Edit", "btn-ghost-purp", () => openEditor(i, cat));
    mk("Delete", "btn-danger", () => deletePrompt(cat, i));

    header.appendChild(left);
    header.appendChild(btns);

    const divider = document.createElement("div");
    divider.className = "card-divider";
    const txt = document.createElement("div");
    txt.className = "card-text";
    txt.textContent = p;

    card.appendChild(header);
    card.appendChild(divider);
    card.appendChild(txt);
    wrap.appendChild(card);
  });
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── CRUD ──────────────────────────────────────────────────────────────────────

function isDup(cat, text, skipIndex = null) {
  const t = text.trim().toLowerCase();
  return (data[cat] || []).some((p, i) => i !== skipIndex && p.trim().toLowerCase() === t);
}

function deletePrompt(cat, index) {
  const p = data[cat][index];
  const preview = p.length > 70 ? p.slice(0, 70) + "…" : p;
  if (!confirm(`Delete this prompt?\n\n"${preview}"`)) return;
  const wasFav = isFav(cat, p);
  data[cat].splice(index, 1);
  if (wasFav && !data[cat].includes(p)) {
    favs[cat].splice(favs[cat].indexOf(p), 1);
    saveFavs();
  }
  pushUndo(["prompt", cat, index, p, wasFav]);
  saveData(data);
  refresh();
  showToast("Deleted — Ctrl+Z to undo");
}

function openMoveMenu(e, cat, index) {
  const items = cats().filter(c => c !== cat).map(c => ({
    label: `${c} (${(data[c] || []).length})`,
    action: () => movePrompt(cat, index, c)
  }));
  if (!items.length) { showToast("No other category"); return; }
  openPopMenu(e.clientX, e.clientY, items, "MOVE TO");
}

function movePrompt(cat, index, target) {
  const p = data[cat][index];
  if (isDup(target, p) && !confirm(`This prompt already exists in "${target}".\nMove anyway?`)) return;
  const wasFav = isFav(cat, p);
  data[cat].splice(index, 1);
  if (wasFav && !data[cat].includes(p)) favs[cat].splice(favs[cat].indexOf(p), 1);
  data[target].push(p);
  if (wasFav && !isFav(target, p)) (favs[target] || (favs[target] = [])).push(p);
  saveFavs();
  saveData(data);
  refresh();
  showToast(`Moved to "${target}"`);
}

function refresh() {
  renderSidebar();
  if (selected) selectCat(selected);
}

// ── Editor ────────────────────────────────────────────────────────────────────

function openEditor(index = null, cat = null) {
  editIndex = index;
  editCat = cat || selected;
  batchMode = false;
  editorCallback = null;
  const title = document.getElementById("editor-title");
  const ta    = document.getElementById("editor-ta");
  document.getElementById("editor-hint").textContent = "";
  title.textContent = index === null ? `Add Prompt  —  ${editCat}` : `Edit Prompt  —  ${editCat}`;
  ta.value = index === null ? "" : data[editCat][index];
  document.getElementById("editor-overlay").classList.remove("hidden");
  ta.focus();
}

// Editor-Modal als generischen Texteditor nutzen (Builder-Textslots)
function openTextEditor(title, initial, cb) {
  editIndex = null;
  batchMode = false;
  editorCallback = cb;
  document.getElementById("editor-title").textContent = title;
  document.getElementById("editor-hint").textContent = "";
  const ta = document.getElementById("editor-ta");
  ta.value = initial;
  document.getElementById("editor-overlay").classList.remove("hidden");
  ta.focus();
}

function openBatch() {
  editIndex = null;
  batchMode = true;
  document.getElementById("editor-title").textContent = `Add Batch  —  ${selected}`;
  document.getElementById("editor-hint").textContent =
    "Paste numbered prompts:  1: ...  2. ...  3) ...";
  const ta = document.getElementById("editor-ta");
  ta.value = "";
  document.getElementById("editor-overlay").classList.remove("hidden");
  ta.focus();
}

function closeEditor() {
  editorCallback = null;
  document.getElementById("editor-overlay").classList.add("hidden");
}

function saveEditor() {
  const text = document.getElementById("editor-ta").value.trim();
  if (!text) return;
  if (editorCallback) {
    const cb = editorCallback;
    closeEditor();
    cb(text);
    return;
  }
  if (batchMode) {
    const prompts = splitBatch(text);
    if (!prompts.length) return;
    let added = 0, skipped = 0;
    for (const p of prompts) {
      if (isDup(selected, p)) { skipped++; continue; }
      data[selected].push(p);
      added++;
    }
    saveData(data);
    closeEditor();
    refresh();
    showToast(skipped
      ? `${added} added, ${skipped} duplicate${skipped !== 1 ? "s" : ""} skipped`
      : `${added} prompt${added !== 1 ? "s" : ""} added!`);
    return;
  }
  if (editIndex === null) {
    if (isDup(editCat, text) && !confirm(`This prompt already exists in "${editCat}".\nAdd anyway?`)) return;
    data[editCat].push(text);
  } else {
    if (isDup(editCat, text, editIndex) && !confirm(`This prompt already exists in "${editCat}".\nSave anyway?`)) return;
    const old = data[editCat][editIndex];
    data[editCat][editIndex] = text;
    // Favoriten-Stern mitnehmen
    if (isFav(editCat, old) && !data[editCat].includes(old)) {
      favs[editCat][favs[editCat].indexOf(old)] = text;
      saveFavs();
    }
  }
  saveData(data);
  closeEditor();
  refresh();
}

function editorOverlayClick(e) {
  if (e.target === document.getElementById("editor-overlay")) closeEditor();
}

// ── Random ────────────────────────────────────────────────────────────────────

function openRandom() {
  const sel = document.getElementById("rnd-cat");
  sel.innerHTML = cats().map(c => `<option${c === selected ? " selected" : ""}>${escHtml(c)}</option>`).join("");
  document.getElementById("rnd-results").innerHTML = "";
  document.getElementById("rnd-info").textContent = "";
  document.getElementById("copy-all-btn").disabled = true;
  lastRndResults = [];
  document.getElementById("rnd-overlay").classList.remove("hidden");
  generateRandom();
}

function closeRandom() {
  document.getElementById("rnd-overlay").classList.add("hidden");
}

function rndOverlayClick(e) {
  if (e.target === document.getElementById("rnd-overlay")) closeRandom();
}

function generateRandom() {
  const cat  = document.getElementById("rnd-cat").value;
  const n    = Math.max(1, parseInt(document.getElementById("rnd-count").value) || 10);
  const pool = data[cat] || [];
  const res  = document.getElementById("rnd-results");
  res.innerHTML = "";
  document.getElementById("copy-all-btn").disabled = true;
  lastRndResults = [];

  if (!pool.length) {
    res.innerHTML = '<p class="empty-msg" style="margin-top:30px;">No prompts in this category.</p>';
    document.getElementById("rnd-info").textContent = "";
    return;
  }

  const actual  = Math.min(n, pool.length);
  const picked  = [...pool].sort(() => Math.random() - 0.5).slice(0, actual);
  lastRndResults = picked;
  const note = actual < n ? ` (max. ${actual} available)` : "";
  document.getElementById("rnd-info").textContent =
    `${actual} Prompts from "${cat}"${note}  —  scroll with mouse wheel`;

  picked.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.marginBottom = "6px";
    card.innerHTML = `
      <div class="card-header">
        <span class="card-num">#${String(i + 1).padStart(2, "0")}</span>
        <button class="btn btn-ghost" onclick="copyText(${JSON.stringify(p)})">Copy</button>
      </div>
      <div class="card-divider"></div>
      <div class="card-text">${escHtml(p)}</div>`;
    res.appendChild(card);
  });
  document.getElementById("copy-all-btn").disabled = false;
}

function copyAll() {
  copyText(lastRndResults.join("\n\n"));
}

// ── Builder (Baukasten) ───────────────────────────────────────────────────────

function switchView(name) {
  if (activeView === name) {
    if (name === "builder") renderSlots();
    return;
  }
  activeView = name;
  document.getElementById("lib-view").classList.toggle("hidden", name !== "library");
  document.getElementById("builder-view").classList.toggle("hidden", name !== "builder");
  document.querySelectorAll(".view-tab").forEach(b =>
    b.classList.toggle("active", b.dataset.view === name));
  document.getElementById("mob-cats").style.display = name === "builder" ? "none" : "";
  if (name === "builder") renderSlots();
}

function rollSlot(s, force = false) {
  if (s.type === "text") { s.value = s.text || ""; return; }
  const pool = data[s.cat] || [];
  if (!pool.length) { s.value = null; return; }
  // Gewicht = Wahrscheinlichkeit, dass der Slot diese Runde gefüllt wird
  if (!force && Math.random() * 100 > (s.weight ?? 100)) { s.value = null; return; }
  s.value = pool[Math.floor(Math.random() * pool.length)];
}

function randomizeAll() {
  if (!slots.length) { showToast("Add slots first"); return; }
  slots.forEach(s => { if (!s.locked) rollSlot(s); });
  renderSlots();
  recordHistory();
}

function rerollSlot(i) {
  if (slots[i].locked) return;
  rollSlot(slots[i], true);
  renderSlots();
  recordHistory();
}

function moveSlot(i, d) {
  const j = i + d;
  if (j < 0 || j >= slots.length) return;
  [slots[i], slots[j]] = [slots[j], slots[i]];
  renderSlots();
}

function cycleWeight(i) {
  const steps = [100, 75, 50, 25];
  const s = slots[i];
  s.weight = steps[(steps.indexOf(s.weight ?? 100) + 1) % steps.length];
  renderSlots();
}

function renderSlots() {
  const wrap = document.getElementById("slot-wrap");
  wrap.innerHTML = "";
  if (!slots.length) {
    wrap.innerHTML = '<p class="empty-msg">No slots yet.<br>Click  + Slot  to add a category or free-text slot.</p>';
    updateResult();
    return;
  }
  slots.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "slot-card" + (s.locked ? " locked" : "");

    const head = document.createElement("div");
    head.className = "slot-head";

    const idx = document.createElement("span");
    idx.className = "slot-idx";
    idx.textContent = "#" + String(i + 1).padStart(2, "0");
    head.appendChild(idx);

    const name = document.createElement("span");
    name.className = "slot-name" + (s.type === "text" ? " txt" : "");
    name.textContent = s.type === "text" ? "✏ Free Text" : `${s.cat} (${(data[s.cat] || []).length})`;
    head.appendChild(name);

    const mk = (label, cls, fn, title) => {
      const b = document.createElement("button");
      b.className = "btn " + cls;
      b.textContent = label;
      if (title) b.title = title;
      b.addEventListener("click", fn);
      head.appendChild(b);
      return b;
    };

    mk("↑", "btn-ghost", () => moveSlot(i, -1), "Move up");
    mk("↓", "btn-ghost", () => moveSlot(i, 1), "Move down");
    if (s.type === "cat") {
      const wB = mk(`${s.weight ?? 100}%`, "btn-ghost", () => cycleWeight(i), "Chance this slot is used per roll");
      if ((s.weight ?? 100) < 100) wB.style.color = "var(--purp)";
      mk(s.locked ? "🔒" : "🔓", "btn-ghost", () => { s.locked = !s.locked; renderSlots(); }, "Lock value");
      mk("Pick", "btn-ghost-purp", () => openPick(i), "Pick a prompt manually");
      const rB = mk("🎲", "btn-ghost", () => rerollSlot(i), "Reroll this slot");
      if (s.locked) rB.disabled = true;
    } else {
      mk("Edit", "btn-ghost-purp", () => editTextSlot(i));
    }
    mk("✕", "btn-danger", () => { slots.splice(i, 1); renderSlots(); }, "Remove slot");

    const divider = document.createElement("div");
    divider.className = "card-divider";

    const val = document.createElement("div");
    const text = s.type === "text" ? (s.text || "") : s.value;
    if (text) {
      val.className = "slot-val";
      val.textContent = text;
    } else {
      val.className = "slot-val none";
      val.textContent = (data[s.cat] || []).length
        ? "— skipped this round — press Randomize"
        : "Category is empty";
    }

    card.appendChild(head);
    card.appendChild(divider);
    card.appendChild(val);
    wrap.appendChild(card);
  });
  updateResult();
}

function openAddSlotMenu(e) {
  const items = [{ label: "✏ Free text...", action: addTextSlot }];
  if (cats().length) items.push({ sep: true });
  for (const c of cats()) {
    items.push({ label: `${c} (${(data[c] || []).length})`, action: () => {
      slots.push({ type: "cat", cat: c, value: null, locked: false, weight: 100 });
      renderSlots();
    }});
  }
  openPopMenu(e.clientX, e.clientY, items, "ADD SLOT");
}

function addTextSlot() {
  openTextEditor("Free Text Slot", "", text => {
    slots.push({ type: "text", text, value: text, locked: false, weight: 100 });
    renderSlots();
  });
}

function editTextSlot(i) {
  openTextEditor("Edit Free Text", slots[i].text || "", text => {
    slots[i].text = text;
    slots[i].value = text;
    renderSlots();
  });
}

// ── Builder: Ergebnis ─────────────────────────────────────────────────────────

function resultText() {
  return slots
    .map(s => (s.type === "text" ? (s.text || "") : (s.value || "")).trim())
    .filter(Boolean)
    .join(document.getElementById("sep-input").value || ", ");
}

function updateResult() {
  const el = document.getElementById("result-text");
  const t = resultText();
  if (t) {
    el.textContent = t;
    el.classList.remove("empty");
  } else {
    el.textContent = slots.length ? "Press Randomize to generate a result..." : "Add slots and press Randomize...";
    el.classList.add("empty");
  }
  document.getElementById("copy-res-btn").disabled = !t;
  document.getElementById("save-res-btn").disabled = !t;
}

function copyResult() {
  const t = resultText();
  if (t) copyText(t);
}

function openSaveResultMenu(e) {
  if (!resultText()) return;
  const items = cats().map(c => ({
    label: `${c} (${(data[c] || []).length})`,
    action: () => saveResultTo(c)
  }));
  if (!items.length) { showToast("No categories"); return; }
  openPopMenu(e.clientX, e.clientY, items, "SAVE TO");
}

function saveResultTo(cat) {
  const t = resultText();
  if (!t) return;
  if (isDup(cat, t)) { showToast(`Already exists in "${cat}"`); return; }
  data[cat].push(t);
  saveData(data);
  renderSidebar();
  showToast(`Saved to "${cat}"`);
}

// ── Builder: History (nur im Speicher) ────────────────────────────────────────

function recordHistory() {
  const t = resultText();
  if (!t || histArr[0] === t) return;
  histArr.unshift(t);
  if (histArr.length > 20) histArr.pop();
}

function openHistory() {
  const list = document.getElementById("hist-list");
  list.innerHTML = "";
  if (!histArr.length) {
    list.innerHTML = '<p class="empty-msg" style="margin-top:30px;">No results yet.<br>Press Randomize in the Builder.</p>';
  }
  histArr.forEach((t, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.marginBottom = "6px";

    const header = document.createElement("div");
    header.className = "card-header";
    const num = document.createElement("span");
    num.className = "card-num";
    num.textContent = "#" + String(i + 1).padStart(2, "0");
    const copyB = document.createElement("button");
    copyB.className = "btn btn-ghost";
    copyB.textContent = "Copy";
    copyB.addEventListener("click", () => copyText(t));
    header.appendChild(num);
    header.appendChild(copyB);

    const divider = document.createElement("div");
    divider.className = "card-divider";
    const txt = document.createElement("div");
    txt.className = "card-text";
    txt.textContent = t;

    card.appendChild(header);
    card.appendChild(divider);
    card.appendChild(txt);
    list.appendChild(card);
  });
  document.getElementById("hist-overlay").classList.remove("hidden");
}

function closeHistory() {
  document.getElementById("hist-overlay").classList.add("hidden");
}

// ── Builder: Pick (manuell wählen) ────────────────────────────────────────────

let pickSlotIndex = null;

function openPick(i) {
  pickSlotIndex = i;
  document.getElementById("pick-title").textContent = `Pick from "${slots[i].cat}"`;
  document.getElementById("pick-search").value = "";
  renderPickList();
  document.getElementById("pick-overlay").classList.remove("hidden");
  document.getElementById("pick-search").focus();
}

function renderPickList() {
  const s = slots[pickSlotIndex];
  if (!s) return;
  const q = document.getElementById("pick-search").value.trim().toLowerCase();
  const list = document.getElementById("pick-list");
  list.innerHTML = "";
  const pool = (data[s.cat] || []).filter(p => !q || p.toLowerCase().includes(q));
  if (!pool.length) {
    list.innerHTML = '<p class="empty-msg" style="margin-top:30px;">No prompts found.</p>';
    return;
  }
  pool.forEach(p => {
    const it = document.createElement("div");
    it.className = "pick-item";
    it.textContent = p;
    it.addEventListener("click", () => {
      s.value = p;
      s.locked = true;   // manuell gewählt → fixieren
      closePick();
      renderSlots();
    });
    list.appendChild(it);
  });
}

function closePick() {
  document.getElementById("pick-overlay").classList.add("hidden");
}

// ── Builder: Templates ────────────────────────────────────────────────────────

function openTplMenu(e) {
  const items = [{ label: "💾 Save current as template...", action: () => {
    if (!slots.length) { showToast("No slots to save"); return; }
    nameMode = "template";
    openNameModal("Save Template", "");
  }}];
  const names = Object.keys(templates);
  if (names.length) {
    items.push({ sep: true });
    for (const n of names) items.push({ label: n, action: () => loadTemplate(n) });
    items.push({ sep: true });
    for (const n of names) items.push({ label: `🗑 Delete "${n}"`, danger: true, action: () => {
      if (!confirm(`Delete template "${n}"?`)) return;
      delete templates[n];
      saveTemplates();
      showToast("Template deleted");
    }});
  }
  openPopMenu(e.clientX, e.clientY, items, "TEMPLATES");
}

function saveTemplate(name) {
  templates[name] = slots.map(s => s.type === "text"
    ? { type: "text", text: s.text || "" }
    : { type: "cat", cat: s.cat, weight: s.weight ?? 100 });
  saveTemplates();
  showToast(`Template "${name}" saved`);
}

function loadTemplate(name) {
  const tpl = templates[name];
  if (!Array.isArray(tpl)) return;
  slots = [];
  let missing = 0;
  for (const e of tpl) {
    if (typeof e === "string") {   // altes Format: nur Kategoriename
      if (e in data) slots.push({ type: "cat", cat: e, value: null, locked: false, weight: 100 });
      else missing++;
    } else if (e && e.type === "text") {
      slots.push({ type: "text", text: e.text || "", value: e.text || "", locked: false, weight: 100 });
    } else if (e && e.cat in data) {
      slots.push({ type: "cat", cat: e.cat, value: null, locked: false, weight: e.weight ?? 100 });
    } else {
      missing++;
    }
  }
  slots.forEach(s => rollSlot(s));
  renderSlots();
  recordHistory();
  showToast(missing
    ? `Template loaded — ${missing} missing categor${missing !== 1 ? "ies" : "y"} skipped`
    : `Template "${name}" loaded`);
}

// ── Export / Import ───────────────────────────────────────────────────────────

function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = "promptvault_backup.json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("Exported!");
}

function importJSON() {
  document.getElementById("file-input").value = "";
  document.getElementById("file-input").click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (typeof imported !== "object" || Array.isArray(imported))
        throw new Error("Invalid format");

      const merged = { ...data };
      for (const cat of Object.keys(imported)) {
        if (!Array.isArray(imported[cat])) continue;
        // merge: unbekannte Kategorien anlegen, doppelte Prompts überspringen
        if (!Array.isArray(merged[cat])) merged[cat] = [];
        const existing = new Set(merged[cat]);
        for (const p of imported[cat]) {
          if (typeof p === "string" && !existing.has(p)) {
            merged[cat].push(p);
            existing.add(p);
          }
        }
      }
      data = merged;
      saveData(data);
      refresh();
      showToast("Imported!");
    } catch {
      alert("Invalid JSON file. Please use a PromptVault backup.");
    }
  };
  reader.readAsText(file);
}

// ── Copy / Toast ──────────────────────────────────────────────────────────────

function copyText(text) {
  navigator.clipboard.writeText(text)
    .then(() => showToast("Copied!"))
    .catch(() => {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("Copied!");
    });
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────

function isTyping(e) { return e.target.matches("input, textarea, select"); }
function overlayOpen() {
  return [...document.querySelectorAll(".overlay")].some(o => !o.classList.contains("hidden"));
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeEditor(); closeRandom(); closeNameModal(); closeCtxMenu();
    closePopMenu(); closePick(); closeHistory();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" &&
      !document.getElementById("editor-overlay").classList.contains("hidden")) { saveEditor(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !isTyping(e)) {
    e.preventDefault();
    undo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f" && !isTyping(e)) {
    e.preventDefault();
    switchView("library");
    document.getElementById("search").focus();
    return;
  }
  if (e.key === " " && activeView === "builder" && !isTyping(e) && !overlayOpen()) {
    e.preventDefault();
    randomizeAll();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c" &&
      activeView === "builder" && !isTyping(e) && !overlayOpen() &&
      !window.getSelection().toString()) {
    copyResult();
  }
});

document.getElementById("name-input").addEventListener("keydown", e => {
  if (e.key === "Enter") saveNameModal();
});

// Suche entprellt: erst rendern, wenn 200 ms nicht mehr getippt wurde
let searchTimer;
document.getElementById("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderPrompts, 200);
});

// ── Init ──────────────────────────────────────────────────────────────────────
renderSidebar();
selectCat(cats()[0] || null);
</script>
