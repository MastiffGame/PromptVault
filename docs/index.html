<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #06060f;
    --surf:     #0b0b1a;
    --surf2:    #0f0f22;
    --surf3:    #14142e;
    --border:   #1c1c38;
    --bord-h:   #2c2c55;
    --cyan:     #00d4ff;
    --cyan-dim: #002233;
    --cyan-mid: #004d66;
    --purp:     #a78bfa;
    --purp-dim: #1a0d40;
    --purp-mid: #3d2080;
    --red:      #f87171;
    --red-dim:  #1e0808;
    --red-mid:  #4a1010;
    --txt:      #dce4f5;
    --txt2:     #4a5a78;
    --txt3:     #222840;
  }

  body {
    background: var(--bg);
    color: var(--txt);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--surf);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #logo {
    height: 80px;
    min-height: 80px;
    padding: 18px 18px 0;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  #logo .logo-line {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  #logo .logo-line span:first-child { color: var(--cyan); }
  #logo .logo-line span:last-child  { color: var(--purp); }
  #logo .logo-sub {
    font-size: 9px;
    color: var(--txt2);
    margin-top: 4px;
  }

  #cat-label {
    font-size: 9px;
    font-weight: bold;
    color: var(--txt3);
    padding: 10px 18px 4px;
    letter-spacing: 1px;
  }

  #cat-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 6px;
  }
  #cat-list::-webkit-scrollbar { width: 4px; }
  #cat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .cat-row {
    display: flex;
    align-items: center;
    height: 38px;
    border-radius: 6px;
    margin: 2px 0;
    cursor: pointer;
    background: var(--surf);
    transition: background 0.15s;
  }
  .cat-row:hover { background: var(--surf3); }
  .cat-row.selected { background: var(--surf3); }

  .cat-bar {
    width: 3px;
    height: 26px;
    border-radius: 2px;
    background: transparent;
    margin: 0 6px 0 4px;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .cat-row.selected .cat-bar { background: var(--cyan); }

  .cat-name {
    flex: 1;
    font-size: 13px;
    color: var(--txt);
    transition: color 0.15s;
  }
  .cat-row.selected .cat-name { color: var(--cyan); }

  .cat-badge {
    font-size: 10px;
    font-weight: bold;
    color: var(--txt2);
    background: var(--surf3);
    padding: 2px 7px;
    border-radius: 10px;
    margin-right: 8px;
    transition: color 0.15s, background 0.15s;
  }
  .cat-row.selected .cat-badge { color: var(--cyan); background: var(--cyan-dim); }

  /* ── CONTENT ── */
  #content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #topbar {
    height: 66px;
    min-height: 66px;
    background: var(--surf);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 0 22px;
    gap: 12px;
  }

  #top-left { display: flex; flex-direction: column; justify-content: center; }
  #title-lbl { font-size: 17px; font-weight: bold; color: var(--txt); }
  #count-lbl { font-size: 10px; color: var(--txt2); margin-top: 2px; }

  #top-right { display: flex; align-items: center; gap: 8px; }

  input#search {
    background: var(--surf2);
    border: 1px solid var(--bord-h);
    border-radius: 10px;
    color: var(--txt);
    font-size: 12px;
    padding: 0 14px;
    height: 34px;
    width: 165px;
    outline: none;
    transition: border-color 0.15s;
  }
  input#search::placeholder { color: var(--txt2); }
  input#search:focus { border-color: var(--cyan); }

  /* ── BUTTONS ── */
  .btn {
    height: 34px;
    border-radius: 10px;
    border: 1px solid;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    padding: 0 16px;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn:disabled { opacity: 0.35; cursor: default; }

  .btn-cyan {
    background: var(--cyan-dim);
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .btn-cyan:not(:disabled):hover { background: var(--cyan-mid); }

  .btn-purp {
    background: var(--purp-dim);
    border-color: var(--purp);
    color: var(--purp);
  }
  .btn-purp:not(:disabled):hover { background: var(--purp-mid); }

  .btn-ghost {
    background: transparent;
    border-color: var(--bord-h);
    color: var(--txt2);
    font-size: 11px;
    height: 26px;
    border-radius: 8px;
    padding: 0 10px;
    font-weight: normal;
  }
  .btn-ghost:hover { background: var(--surf3); }

  .btn-ghost-purp {
    background: transparent;
    border-color: var(--bord-h);
    color: var(--purp);
    font-size: 11px;
    height: 26px;
    border-radius: 8px;
    padding: 0 10px;
    font-weight: normal;
  }
  .btn-ghost-purp:hover { background: var(--purp-dim); }

  .btn-danger {
    background: var(--red-dim);
    border-color: var(--red);
    color: var(--red);
    font-size: 11px;
    height: 26px;
    border-radius: 8px;
    padding: 0 10px;
    font-weight: normal;
  }
  .btn-danger:hover { background: var(--red-mid); }

  /* ── PROMPT LIST ── */
  #list-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
  }
  #list-wrap::-webkit-scrollbar { width: 6px; }
  #list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .empty-msg {
    color: var(--txt2);
    font-size: 13px;
    text-align: center;
    margin-top: 60px;
    line-height: 1.7;
  }

  .card {
    background: var(--surf2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px 4px;
  }

  .card-num {
    font-family: Consolas, monospace;
    font-size: 10px;
    font-weight: bold;
    color: var(--cyan);
  }

  .card-btns { display: flex; gap: 4px; }

  .card-divider { height: 1px; background: var(--border); margin: 2px 12px; }

  .card-text {
    font-family: Consolas, monospace;
    font-size: 12px;
    color: var(--txt);
    padding: 4px 12px 10px;
    line-height: 1.5;
    word-break: break-word;
  }

  /* ── OVERLAY / MODAL ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 2, 8, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .overlay.hidden { display: none; }

  .modal {
    background: var(--surf);
    border: 1px solid var(--bord-h);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    background: var(--surf2);
    padding: 14px 18px;
    font-size: 14px;
    font-weight: bold;
    color: var(--cyan);
    flex-shrink: 0;
  }

  .modal textarea {
    background: var(--surf2);
    border: 1px solid var(--bord-h);
    border-radius: 10px;
    color: var(--txt);
    font-family: Consolas, monospace;
    font-size: 13px;
    resize: none;
    outline: none;
    padding: 10px 12px;
    margin: 14px 18px 8px;
    flex: 1;
    min-height: 200px;
  }
  .modal textarea:focus { border-color: var(--cyan); }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 8px 18px 16px;
    flex-shrink: 0;
  }

  .modal-footer .btn { font-size: 12px; height: 34px; }

  /* ── RANDOM MODAL ── */
  #rnd-modal { width: min(800px, 95vw); height: min(680px, 92vh); }

  .rnd-ctrl {
    background: var(--surf2);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: flex-end;
    gap: 0;
    padding: 8px 14px 12px;
    margin: 10px 18px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .rnd-ctrl label { font-size: 10px; color: var(--txt2); display: block; margin-bottom: 4px; }

  .rnd-ctrl select {
    background: var(--surf3);
    border: 1px solid var(--bord-h);
    border-radius: 8px;
    color: var(--txt);
    font-size: 13px;
    padding: 0 10px;
    height: 34px;
    width: 200px;
    outline: none;
    cursor: pointer;
  }

  .rnd-ctrl input[type=number] {
    background: var(--surf3);
    border: 1px solid var(--bord-h);
    border-radius: 8px;
    color: var(--cyan);
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    padding: 0;
    height: 34px;
    width: 65px;
    outline: none;
  }
  .rnd-ctrl input[type=number]::-webkit-inner-spin-button { display: none; }

  #rnd-info {
    font-size: 10px;
    color: var(--txt2);
    text-align: center;
    margin: 0 18px 2px;
    min-height: 16px;
  }

  #rnd-results {
    flex: 1;
    overflow-y: auto;
    margin: 0 18px 8px;
    padding-right: 4px;
  }
  #rnd-results::-webkit-scrollbar { width: 5px; }
  #rnd-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  #rnd-footer {
    background: var(--surf2);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    flex-shrink: 0;
  }

  /* ── EDITOR MODAL ── */
  #editor-modal { width: min(680px, 95vw); }

  /* ── COPIED TOAST ── */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--cyan-mid);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-size: 12px;
    padding: 8px 20px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div id="logo">
    <div class="logo-line"><span>PROMPT</span><span>VAULT</span></div>
    <div class="logo-sub">Image Generation</div>
  </div>
  <div id="cat-label">CATEGORIES</div>
  <div id="cat-list"></div>
</aside>

<!-- CONTENT -->
<main id="content">
  <div id="topbar">
    <div id="top-left">
      <div id="title-lbl">Select a category</div>
      <div id="count-lbl"></div>
    </div>
    <div id="top-right">
      <input id="search" type="text" placeholder="  Search...">
      <button class="btn btn-purp" id="rnd-btn" disabled onclick="openRandom()">&#9733; Random</button>
      <button class="btn btn-cyan" id="add-btn" disabled onclick="openEditor()">+ Prompt</button>
    </div>
  </div>
  <div id="list-wrap">
    <p class="empty-msg">&#8592; Select a category on the left</p>
  </div>
</main>

<!-- EDITOR OVERLAY -->
<div class="overlay hidden" id="editor-overlay" onclick="editorOverlayClick(event)">
  <div class="modal" id="editor-modal">
    <div class="modal-header" id="editor-title">Add Prompt</div>
    <textarea id="editor-ta" placeholder="Enter your prompt here..."></textarea>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditor()">Cancel</button>
      <button class="btn btn-cyan" onclick="saveEditor()">Save</button>
    </div>
  </div>
</div>

<!-- RANDOM OVERLAY -->
<div class="overlay hidden" id="rnd-overlay" onclick="rndOverlayClick(event)">
  <div class="modal" id="rnd-modal" style="display:flex;flex-direction:column;">
    <div class="modal-header" style="color:var(--purp)">&#9733; Random Prompts</div>
    <div class="rnd-ctrl">
      <div>
        <label>Category</label>
        <select id="rnd-cat"></select>
      </div>
      <div>
        <label>Count</label>
        <input type="number" id="rnd-count" value="10" min="1">
      </div>
      <div style="display:flex;align-items:flex-end;">
        <button class="btn btn-purp" onclick="generateRandom()" style="height:34px;font-size:12px;">Generate</button>
      </div>
    </div>
    <div id="rnd-info"></div>
    <div id="rnd-results"></div>
    <div id="rnd-footer">
      <button class="btn btn-cyan" id="copy-all-btn" disabled onclick="copyAll()" style="font-size:12px;height:34px;">Copy All</button>
      <button class="btn btn-ghost" onclick="closeRandom()" style="font-size:12px;height:34px;border-radius:10px;">Close</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast">Copied!</div>

<script>
const CATEGORIES = ["Clothing", "Hairstyle", "Environment", "Appearance", "Position"];
const STORAGE_KEY = "promptvault_data";

// ── Data ──────────────────────────────────────────────────────────────────────

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : {};
    let changed = false;
    for (const cat of CATEGORIES) {
      if (!Array.isArray(data[cat])) { data[cat] = []; changed = true; }
    }
    if (changed) saveData(data);
    return data;
  } catch {
    const data = {};
    CATEGORIES.forEach(c => data[c] = []);
    return data;
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();
let selected = null;
let editIndex = null;
let lastRndResults = [];

// ── Sidebar ───────────────────────────────────────────────────────────────────

function renderSidebar() {
  const list = document.getElementById("cat-list");
  list.innerHTML = "";
  for (const cat of CATEGORIES) {
    const count = (data[cat] || []).length;
    const sel = cat === selected;
    const row = document.createElement("div");
    row.className = "cat-row" + (sel ? " selected" : "");
    row.innerHTML = `
      <div class="cat-bar"></div>
      <div class="cat-name">${cat}</div>
      <div class="cat-badge">${count}</div>`;
    row.onclick = () => selectCat(cat);
    list.appendChild(row);
  }
}

function selectCat(cat) {
  selected = cat;
  document.getElementById("search").value = "";
  document.getElementById("title-lbl").textContent = cat;
  const n = (data[cat] || []).length;
  document.getElementById("count-lbl").textContent = n + " Prompt" + (n !== 1 ? "s" : "");
  document.getElementById("add-btn").disabled = false;
  document.getElementById("rnd-btn").disabled = n === 0;
  renderSidebar();
  renderPrompts();
}

// ── Prompt List ───────────────────────────────────────────────────────────────

function renderPrompts() {
  const wrap = document.getElementById("list-wrap");
  wrap.innerHTML = "";
  if (!selected) {
    wrap.innerHTML = '<p class="empty-msg">&#8592; Select a category on the left</p>';
    return;
  }
  const q = document.getElementById("search").value.trim().toLowerCase();
  const prompts = data[selected] || [];
  const filtered = prompts.map((p, i) => ({ i, p })).filter(({ p }) => !q || p.toLowerCase().includes(q));

  if (filtered.length === 0) {
    const msg = q
      ? `No results for "${document.getElementById("search").value}"`
      : "No prompts yet.\nClick  + Prompt  to add one.";
    wrap.innerHTML = `<p class="empty-msg">${msg.replace(/\n/g, "<br>")}</p>`;
    return;
  }

  filtered.forEach(({ i, p }, rowIdx) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-header">
        <span class="card-num">#${String(i + 1).padStart(2, "0")}</span>
        <div class="card-btns">
          <button class="btn btn-ghost" onclick="copyText(${JSON.stringify(p)})">Copy</button>
          <button class="btn btn-ghost-purp" onclick="openEditor(${i})">Edit</button>
          <button class="btn btn-danger" onclick="deletePrompt(${i})">Delete</button>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="card-text">${escHtml(p)}</div>`;
    wrap.appendChild(card);
  });
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── CRUD ──────────────────────────────────────────────────────────────────────

function deletePrompt(index) {
  const p = data[selected][index];
  const preview = p.length > 70 ? p.slice(0, 70) + "…" : p;
  if (!confirm(`Delete this prompt?\n\n"${preview}"`)) return;
  data[selected].splice(index, 1);
  saveData(data);
  refresh();
}

function refresh() {
  renderSidebar();
  if (selected) selectCat(selected);
}

// ── Editor ────────────────────────────────────────────────────────────────────

function openEditor(index = null) {
  editIndex = index;
  const title = document.getElementById("editor-title");
  const ta = document.getElementById("editor-ta");
  if (index === null) {
    title.textContent = `Add Prompt  —  ${selected}`;
    ta.value = "";
  } else {
    title.textContent = "Edit Prompt";
    ta.value = data[selected][index];
  }
  document.getElementById("editor-overlay").classList.remove("hidden");
  ta.focus();
}

function closeEditor() {
  document.getElementById("editor-overlay").classList.add("hidden");
}

function saveEditor() {
  const text = document.getElementById("editor-ta").value.trim();
  if (!text) return;
  if (editIndex === null) {
    data[selected].push(text);
  } else {
    data[selected][editIndex] = text;
  }
  saveData(data);
  closeEditor();
  refresh();
}

function editorOverlayClick(e) {
  if (e.target === document.getElementById("editor-overlay")) closeEditor();
}

// ── Random ────────────────────────────────────────────────────────────────────

function openRandom() {
  const sel = document.getElementById("rnd-cat");
  sel.innerHTML = CATEGORIES.map(c => `<option${c === selected ? " selected" : ""}>${c}</option>`).join("");
  document.getElementById("rnd-results").innerHTML = "";
  document.getElementById("rnd-info").textContent = "";
  document.getElementById("copy-all-btn").disabled = true;
  lastRndResults = [];
  document.getElementById("rnd-overlay").classList.remove("hidden");
  generateRandom();
}

function closeRandom() {
  document.getElementById("rnd-overlay").classList.add("hidden");
}

function rndOverlayClick(e) {
  if (e.target === document.getElementById("rnd-overlay")) closeRandom();
}

function generateRandom() {
  const cat = document.getElementById("rnd-cat").value;
  const n = Math.max(1, parseInt(document.getElementById("rnd-count").value) || 10);
  const pool = data[cat] || [];
  const res = document.getElementById("rnd-results");
  res.innerHTML = "";
  document.getElementById("copy-all-btn").disabled = true;
  lastRndResults = [];

  if (pool.length === 0) {
    res.innerHTML = '<p class="empty-msg" style="margin-top:30px;">No prompts in this category.</p>';
    document.getElementById("rnd-info").textContent = "";
    return;
  }

  const actual = Math.min(n, pool.length);
  const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, actual);
  lastRndResults = shuffled;
  const note = actual < n ? ` (max. ${actual} available)` : "";
  document.getElementById("rnd-info").textContent =
    `${actual} Prompts from "${cat}"${note}  —  scroll with mouse wheel`;

  shuffled.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.marginBottom = "6px";
    card.innerHTML = `
      <div class="card-header">
        <span class="card-num">#${String(i + 1).padStart(2, "0")}</span>
        <button class="btn btn-ghost" onclick="copyText(${JSON.stringify(p)})">Copy</button>
      </div>
      <div class="card-divider"></div>
      <div class="card-text">${escHtml(p)}</div>`;
    res.appendChild(card);
  });

  document.getElementById("copy-all-btn").disabled = false;
}

function copyAll() {
  copyText(lastRndResults.join("\n\n"));
}

// ── Copy / Toast ──────────────────────────────────────────────────────────────

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast("Copied!")).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast("Copied!");
  });
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeEditor(); closeRandom(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") saveEditor();
});

document.getElementById("search").addEventListener("input", renderPrompts);

// ── Init ──────────────────────────────────────────────────────────────────────
renderSidebar();
if (CATEGORIES.length) selectCat(CATEGORIES[0]);
</script>
</body>
</html>
